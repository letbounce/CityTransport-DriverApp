  <text x="30" y="875" font-size="10" font-style="italic" fill="#5a4a2a">Узгоджено зі схемою автоматизації (рис. 3.4), структурою КТЗ (рис. 3.5) та схемою АРМ водія (рис. 3.6). Загальна архітектура — клієнт-сервер з REST API + JWT-захистом.</text>
