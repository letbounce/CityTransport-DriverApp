<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2c3958"/>
    </marker>
  </defs>

  <text x="640" y="22" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 3.7. Схема мережі передачі даних інформаційної підсистеми «Мобільний термінал водія»</text>

  <!-- ============ ZONE 1: Зовнішня (мобільні термінали + публічні мережі) ============ -->
  <rect x="20" y="50" width="900" height="280" fill="none" stroke="#7a8aac" stroke-width="1.4" stroke-dasharray="5,3"/>
  <rect x="20" y="50" width="900" height="28" fill="#eef0f3" stroke="#7a8aac" stroke-width="1.4"/>
  <text x="470" y="69" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic" fill="#2c3958">Зона 1. Зовнішня мережа (Internet / мобільні оператори) — поза периметром АТП</text>

  <!-- Mobile drivers group (left) -->
  <g transform="translate(40,90)">
    <rect width="220" height="160" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="110" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">«mobile devices»</text>
    <text x="110" y="40" text-anchor="middle" font-size="11" fill="#2c3958">Смартфони водіїв (~150)</text>
    <line x1="10" y1="48" x2="210" y2="48" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="66" font-size="10" fill="#2c3958">— Android 7.0+</text>
    <text x="10" y="82" font-size="10" fill="#2c3958">— RoutePulse app + Retrofit</text>
    <text x="10" y="98" font-size="10" fill="#2c3958">— LocationTrackingService</text>
    <text x="10" y="114" font-size="10" fill="#2c3958">— LTE/4G модем</text>
    <text x="10" y="130" font-size="10" fill="#2c3958">— WiFi 802.11 b/g/n</text>
    <text x="10" y="150" font-size="10" font-style="italic" fill="#5a6b8a">~150 одночасних підключень</text>
  </g>

  <!-- Mobile carrier (middle) -->
  <g transform="translate(310,90)">
    <rect width="220" height="160" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="110" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">«mobile carrier»</text>
    <text x="110" y="40" text-anchor="middle" font-size="11" fill="#2c3958">Базова станція 4G / LTE</text>
    <line x1="10" y1="48" x2="210" y2="48" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="66" font-size="10" fill="#2c3958">— Київстар / Vodafone /</text>
    <text x="10" y="82" font-size="10" fill="#2c3958">  lifecell (LTE Band 3/7/20)</text>
    <text x="10" y="100" font-size="10" fill="#2c3958">— Швидкість: 20-100 Mbps</text>
    <text x="10" y="116" font-size="10" fill="#2c3958">— Затримка: 30-80 мс</text>
    <text x="10" y="134" font-size="10" font-style="italic" fill="#5a6b8a">SIM-картка з тарифом</text>
    <text x="10" y="148" font-size="10" font-style="italic" fill="#5a6b8a">«M2M / IoT» (5 GB/міс)</text>
  </g>

  <!-- Internet -->
  <g transform="translate(580,90)">
    <rect width="320" height="160" fill="#eef0f3" stroke="#7a8aac" stroke-width="1.4"/>
    <text x="160" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">«internet»</text>
    <text x="160" y="40" text-anchor="middle" font-size="11" fill="#2c3958">Публічна мережа Internet</text>
    <line x1="10" y1="48" x2="310" y2="48" stroke="#7a8aac" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="66" font-size="10" fill="#2c3958">— Маршрутизація BGP</text>
    <text x="10" y="82" font-size="10" fill="#2c3958">— DNS (резолвинг api.routepulse...)</text>
    <text x="10" y="98" font-size="10" fill="#2c3958">— Зовнішні сервіси:</text>
    <text x="18" y="114" font-size="10" fill="#5a6b8a">· tile.openstreetmap.org</text>
    <text x="18" y="130" font-size="10" fill="#5a6b8a">· play.googleapis.com (FCM)</text>
    <text x="160" y="150" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">TLS 1.2+ end-to-end</text>
  </g>

  <!-- Arrows mobile → carrier → internet -->
  <line x1="260" y1="170" x2="310" y2="170" stroke="#2c3958" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="270" y="163" font-size="9" font-style="italic" fill="#5a6b8a">4G/LTE</text>
  <line x1="530" y1="170" x2="580" y2="170" stroke="#2c3958" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="540" y="163" font-size="9" font-style="italic" fill="#5a6b8a">backbone</text>

  <!-- ============ ZONE 2: Перехідна / DMZ (firewall + uplink + WiFi gateway) ============ -->
  <rect x="20" y="350" width="900" height="180" fill="none" stroke="#c97070" stroke-width="1.4"/>
  <rect x="20" y="350" width="900" height="28" fill="#fdf3f3" stroke="#c97070" stroke-width="1.4"/>
  <text x="470" y="369" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic" fill="#7a3a3a">Зона 2. Periметр АТП — Edge / DMZ</text>

  <!-- ISP uplink -->
  <g transform="translate(40,390)">
    <rect width="200" height="120" fill="#fdf3f3" stroke="#c97070" stroke-width="1.4"/>
    <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">ISP-канал (uplink)</text>
    <line x1="10" y1="30" x2="190" y2="30" stroke="#c97070" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="50" font-size="11" fill="#2c3958">Тип: оптоволокно (FTTH)</text>
    <text x="10" y="68" font-size="11" fill="#2c3958">Швидкість: 100 Mbps</text>
    <text x="10" y="86" font-size="11" fill="#2c3958">Стат. IPv4 + IPv6 /64</text>
    <text x="10" y="106" font-size="10" font-style="italic" fill="#5a6b8a">резервний 4G-USB (fallback)</text>
  </g>

  <!-- Firewall -->
  <g transform="translate(290,390)">
    <rect width="220" height="120" fill="#fdf3f3" stroke="#c97070" stroke-width="1.6"/>
    <text x="110" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">«firewall + VPN»</text>
    <text x="110" y="40" text-anchor="middle" font-size="11" fill="#2c3958">pfSense / OPNsense</text>
    <line x1="10" y1="48" x2="210" y2="48" stroke="#c97070" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="66" font-size="10" fill="#2c3958">— NAT (port 443 → API)</text>
    <text x="10" y="82" font-size="10" fill="#2c3958">— TLS-термінація (LetsEncrypt)</text>
    <text x="10" y="98" font-size="10" fill="#2c3958">— IDS / Fail2ban</text>
    <text x="10" y="114" font-size="10" fill="#2c3958">— VPN для адмінів (WireGuard)</text>
  </g>

  <!-- WiFi gateway / AP controller -->
  <g transform="translate(560,390)">
    <rect width="220" height="120" fill="#fdf3f3" stroke="#c97070" stroke-width="1.4"/>
    <text x="110" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">WiFi-контролер + AP</text>
    <line x1="10" y1="30" x2="210" y2="30" stroke="#c97070" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="50" font-size="11" fill="#2c3958">WiFi 6 (802.11ax)</text>
    <text x="10" y="68" font-size="11" fill="#2c3958">2.4 + 5 GHz</text>
    <text x="10" y="86" font-size="11" fill="#2c3958">SSID: «RoutePulse-AT»</text>
    <text x="10" y="104" font-size="10" font-style="italic" fill="#5a6b8a">WPA2-Enterprise · 802.1X</text>
    <text x="10" y="118" font-size="10" font-style="italic" fill="#5a6b8a">для смартфонів водіїв у депо</text>
  </g>

  <!-- Note: hybrid -->
  <rect x="800" y="390" width="110" height="120" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="855" y="412" text-anchor="middle" font-size="10" font-weight="bold" font-style="italic" fill="#5a4a2a">Hybrid</text>
  <text x="855" y="428" text-anchor="middle" font-size="9" font-style="italic" fill="#5a4a2a">DMZ-зона:</text>
  <text x="855" y="446" text-anchor="middle" font-size="9" fill="#5a4a2a">мобільний</text>
  <text x="855" y="460" text-anchor="middle" font-size="9" fill="#5a4a2a">трафік →</text>
  <text x="855" y="474" text-anchor="middle" font-size="9" fill="#5a4a2a">firewall;</text>
  <text x="855" y="492" text-anchor="middle" font-size="9" fill="#5a4a2a">WiFi-трафік →</text>
  <text x="855" y="506" text-anchor="middle" font-size="9" fill="#5a4a2a">AP-контролер</text>

  <!-- Arrows zone1 → zone2 -->
  <line x1="740" y1="250" x2="395" y2="385" stroke="#2c3958" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="450" y="320" font-size="10" font-style="italic" fill="#5a6b8a">HTTPS · TLS 1.2+ (port 443)</text>

  <line x1="150" y1="250" x2="670" y2="385" stroke="#2c3958" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="220" y="305" font-size="10" font-style="italic" fill="#5a6b8a">альтернативно — WiFi у депо</text>

  <!-- ============ ZONE 3: Внутрішня LAN (сервери + АРМ) ============ -->
  <rect x="20" y="550" width="900" height="290" fill="none" stroke="#7a9a7a" stroke-width="1.6"/>
  <rect x="20" y="550" width="900" height="28" fill="#f0f6ec" stroke="#7a9a7a" stroke-width="1.6"/>
  <text x="470" y="569" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic" fill="#2c3958">Зона 3. Внутрішня LAN депо АТП (192.168.10.0/24, VLAN 10)</text>

  <!-- LAN switch L2 -->
  <g transform="translate(370,590)">
    <rect width="220" height="48" fill="#f0f6ec" stroke="#7a9a7a" stroke-width="1.4"/>
    <text x="110" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">«L2 switch»</text>
    <text x="110" y="40" text-anchor="middle" font-size="10" fill="#2c3958">24-port · 1 Gbps · VLAN 10</text>
  </g>

  <!-- Connect Firewall → Switch -->
  <line x1="400" y1="510" x2="480" y2="590" stroke="#2c3958" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="430" y="556" font-size="10" font-style="italic" fill="#5a6b8a">trunk · 1G</text>

  <line x1="670" y1="510" x2="480" y2="590" stroke="#2c3958" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ROW: 4 endpoint groups under switch -->
  <line x1="480" y1="638" x2="120" y2="660" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="480" y1="638" x2="330" y2="660" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="480" y1="638" x2="640" y2="660" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="480" y1="638" x2="830" y2="660" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- App server -->
  <g transform="translate(40,660)">
    <rect width="160" height="90" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="80" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">«app server»</text>
    <text x="80" y="38" text-anchor="middle" font-size="10" fill="#2c3958">Node.js + Express</text>
    <line x1="10" y1="46" x2="150" y2="46" stroke="#5a6b8a" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="80" y="62" text-anchor="middle" font-size="10" fill="#2c3958">192.168.10.10:3000</text>
    <text x="80" y="78" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">listen :3000 (HTTP)</text>
  </g>

  <!-- DB server -->
  <g transform="translate(250,660)">
    <rect width="160" height="90" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="80" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">«db server»</text>
    <text x="80" y="38" text-anchor="middle" font-size="10" fill="#2c3958">MongoDB 6.x</text>
    <line x1="10" y1="46" x2="150" y2="46" stroke="#5a6b8a" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="80" y="62" text-anchor="middle" font-size="10" fill="#2c3958">192.168.10.20:27017</text>
    <text x="80" y="78" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">internal-only</text>
  </g>

  <!-- Dispatcher workstations -->
  <g transform="translate(560,660)">
    <rect width="160" height="90" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="80" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">АРМ диспетчерів</text>
    <text x="80" y="38" text-anchor="middle" font-size="10" fill="#2c3958">5-6 робочих станцій</text>
    <line x1="10" y1="46" x2="150" y2="46" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="80" y="62" text-anchor="middle" font-size="10" fill="#2c3958">192.168.10.100-110</text>
    <text x="80" y="78" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">Chrome / Edge → API</text>
  </g>

  <!-- Backup + printer + monitor -->
  <g transform="translate(750,660)">
    <rect width="160" height="90" fill="#f0f6ec" stroke="#7a9a7a" stroke-width="1.4"/>
    <text x="80" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Периферія LAN</text>
    <line x1="10" y1="28" x2="150" y2="28" stroke="#7a9a7a" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="44" font-size="10" fill="#2c3958">— Backup NAS</text>
    <text x="10" y="58" font-size="10" fill="#2c3958">— Принтер LAN</text>
    <text x="10" y="72" font-size="10" fill="#2c3958">— 55″ моніторинг-дисплей</text>
    <text x="10" y="86" font-size="10" font-style="italic" fill="#5a6b8a">192.168.10.200-210</text>
  </g>

  <!-- Note about VLAN -->
  <rect x="40" y="765" width="870" height="62" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="50" y="784" font-size="10" font-weight="bold" font-style="italic" fill="#5a4a2a">Налаштування внутрішньої мережі:</text>
  <text x="50" y="800" font-size="10" font-style="italic" fill="#5a4a2a">— VLAN 10 (LAN-сегмент серверної та АРМ);  VLAN 20 (WiFi-AP для смартфонів водіїв) — ізольовані через ACL;  WireGuard VPN-сегмент 10.99.0.0/24 для віддалених адмінів.</text>
  <text x="50" y="816" font-size="10" font-style="italic" fill="#5a4a2a">— Дозволено лише ssh з адмін-VPN до серверів;  з зовні (Internet) — лише TCP/443 → firewall → API server.  Порт MongoDB 27017 не виставлено назовні.</text>

  <!-- ============ SIDE PANEL: Об'ємно-тимчасові показники (правa частина) ============ -->
  <rect x="940" y="50" width="320" height="790" fill="#fffce8" stroke="#b89a5c" stroke-width="1.4" stroke-dasharray="2,2"/>
  <text x="1100" y="72" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic" fill="#5a4a2a">Об'ємно-тимчасові характеристики</text>
  <text x="1100" y="86" text-anchor="middle" font-size="11" font-style="italic" fill="#5a4a2a">переданих даних</text>

  <line x1="950" y1="98" x2="1250" y2="98" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>

  <text x="950" y="118" font-size="11" font-weight="bold" fill="#2c3958">Користувацька активність:</text>
  <text x="950" y="134" font-size="10" fill="#2c3958">— 150 водіїв × 1-2 рейси / зміну</text>
  <text x="950" y="150" font-size="10" fill="#2c3958">— Зміни: 06:00-14:00 / 14:00-22:00</text>
  <text x="950" y="166" font-size="10" fill="#2c3958">— Пік: 07:00-09:00 (start)</text>

  <line x1="950" y1="178" x2="1250" y2="178" stroke="#b89a5c" stroke-width="0.6" stroke-dasharray="2,2"/>

  <text x="950" y="198" font-size="11" font-weight="bold" fill="#2c3958">GPS-телеметрія:</text>
  <text x="950" y="214" font-size="10" fill="#2c3958">— 1 точка / 5 сек × 8 год / водій</text>
  <text x="950" y="230" font-size="10" fill="#2c3958">— ~5760 точок / зміну / водій</text>
  <text x="950" y="246" font-size="10" fill="#2c3958">— батч: 100 точок (~15 хв)</text>
  <text x="950" y="262" font-size="10" fill="#2c3958">— ~150 × 96 батчів = 14400/добу</text>
  <text x="950" y="278" font-size="10" font-style="italic" fill="#5a6b8a">— ~2 KB/батч → ~28 MB/добу</text>

  <line x1="950" y1="290" x2="1250" y2="290" stroke="#b89a5c" stroke-width="0.6" stroke-dasharray="2,2"/>

  <text x="950" y="310" font-size="11" font-weight="bold" fill="#2c3958">Транзакції RoutePulse:</text>
  <text x="950" y="326" font-size="10" fill="#2c3958">— Login: ~150/добу</text>
  <text x="950" y="342" font-size="10" fill="#2c3958">— Створення waybill: ~200/добу</text>
  <text x="950" y="358" font-size="10" fill="#2c3958">— Інциденти: ~30-50/добу</text>
  <text x="950" y="374" font-size="10" fill="#2c3958">— Завершення рейсу: ~200/добу</text>

  <line x1="950" y1="386" x2="1250" y2="386" stroke="#b89a5c" stroke-width="0.6" stroke-dasharray="2,2"/>

  <text x="950" y="406" font-size="11" font-weight="bold" fill="#2c3958">Фото інцидентів:</text>
  <text x="950" y="422" font-size="10" fill="#2c3958">— 1-2 фото на інцидент</text>
  <text x="950" y="438" font-size="10" fill="#2c3958">— Розмір JPEG: ~100-500 KB</text>
  <text x="950" y="454" font-size="10" font-style="italic" fill="#5a6b8a">— ~30-50 MB / добу</text>

  <line x1="950" y1="466" x2="1250" y2="466" stroke="#b89a5c" stroke-width="0.6" stroke-dasharray="2,2"/>

  <text x="950" y="486" font-size="11" font-weight="bold" fill="#2c3958">Сумарний трафік:</text>
  <text x="950" y="502" font-size="10" fill="#2c3958">— Через 4G/LTE: ~80-100 MB/добу</text>
  <text x="950" y="518" font-size="10" fill="#2c3958">— Через WiFi (депо): ~50 MB/добу</text>
  <text x="950" y="534" font-size="10" font-style="italic" fill="#5a6b8a">— ~3-4 GB/місяць загалом</text>

  <line x1="950" y1="546" x2="1250" y2="546" stroke="#b89a5c" stroke-width="0.6" stroke-dasharray="2,2"/>

  <text x="950" y="566" font-size="11" font-weight="bold" fill="#2c3958">Надійність каналів:</text>
  <text x="950" y="582" font-size="10" fill="#2c3958">— SLA провайдера: 99.5%</text>
  <text x="950" y="598" font-size="10" fill="#2c3958">— Backup-канал: 4G-USB stick</text>
  <text x="950" y="614" font-size="10" fill="#2c3958">— Гарантійний термін модема: 3 роки</text>
  <text x="950" y="630" font-size="10" fill="#2c3958">— Стійкість до EMI: відповідно</text>
  <text x="950" y="646" font-size="10" fill="#2c3958">  ETSI EN 301 489-1</text>

  <line x1="950" y1="658" x2="1250" y2="658" stroke="#b89a5c" stroke-width="0.6" stroke-dasharray="2,2"/>

  <text x="950" y="678" font-size="11" font-weight="bold" fill="#2c3958">Тип IP-адресації:</text>
  <text x="950" y="694" font-size="10" fill="#2c3958">— Зовнішня: статичний IPv4 + IPv6</text>
  <text x="950" y="710" font-size="10" fill="#2c3958">— Внутрішня: DHCP (резерв. для</text>
  <text x="950" y="724" font-size="10" fill="#2c3958">  серверів)</text>
  <text x="950" y="740" font-size="10" fill="#2c3958">— Мобільні: NAT провайдера</text>

  <line x1="950" y1="752" x2="1250" y2="752" stroke="#b89a5c" stroke-width="0.6" stroke-dasharray="2,2"/>

  <text x="950" y="772" font-size="10" font-style="italic" fill="#5a4a2a">Кабельне підключення між сервером,</text>
  <text x="950" y="787" font-size="10" font-style="italic" fill="#5a4a2a">switch та АРМ — UTP Cat 6 (1 Gbps);</text>
  <text x="950" y="802" font-size="10" font-style="italic" fill="#5a4a2a">від ISP до firewall — оптоволокно</text>
  <text x="950" y="817" font-size="10" font-style="italic" fill="#5a4a2a">FTTH-SM-02.</text>

  <!-- ============== Bottom legend ============== -->
