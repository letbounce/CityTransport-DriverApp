<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <text x="640" y="24" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 1.1. Організаційна структура автотранспортного підприємства (АТП) з виділенням диспетчерської служби як об'єкта впровадження</text>

  <!-- ============ LEVEL 0: Director (cx=640) ============ -->
  <g transform="translate(540,60)">
    <rect x="0" y="0" width="200" height="50" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.6"/>
    <text x="100" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">ДИРЕКТОР АТП</text>
    <text x="100" y="40" text-anchor="middle" font-size="11" fill="#5a6b8a">(генеральний директор)</text>
  </g>

  <!-- vertical from director down -->
  <line x1="640" y1="110" x2="640" y2="145" stroke="#5a6b8a" stroke-width="1.4"/>
  <!-- horizontal bar L1 -->
  <line x1="350" y1="145" x2="1100" y2="145" stroke="#5a6b8a" stroke-width="1.4"/>
  <!-- drops to 3 deputies -->
  <line x1="350" y1="145" x2="350" y2="175" stroke="#5a6b8a" stroke-width="1.4"/>
  <line x1="900" y1="145" x2="900" y2="175" stroke="#5a6b8a" stroke-width="1.4"/>
  <line x1="1100" y1="145" x2="1100" y2="175" stroke="#5a6b8a" stroke-width="1.4"/>

  <!-- ============ LEVEL 1: Deputies (cx 350, 900, 1100) ============ -->
  <g transform="translate(265,175)">
    <rect x="0" y="0" width="170" height="58" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="85" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Заступник з</text>
    <text x="85" y="40" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">експлуатації</text>
    <text x="85" y="53" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">(планування рейсів)</text>
  </g>

  <g transform="translate(815,175)">
    <rect x="0" y="0" width="170" height="58" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="85" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Заступник з</text>
    <text x="85" y="40" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">технічних питань</text>
    <text x="85" y="53" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">(ремонт ТЗ)</text>
  </g>

  <g transform="translate(1020,175)">
    <rect x="0" y="0" width="160" height="58" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="80" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Головний</text>
    <text x="80" y="40" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">бухгалтер</text>
    <text x="80" y="53" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">(нарахування з/п)</text>
  </g>

  <!-- ============ Connectors L1 → L2 ============ -->
  <!-- From Заст. з експл. (cx=350) -->
  <line x1="350" y1="233" x2="350" y2="265" stroke="#5a6b8a" stroke-width="1.4"/>
  <line x1="170" y1="265" x2="530" y2="265" stroke="#5a6b8a" stroke-width="1.4"/>
  <line x1="170" y1="265" x2="170" y2="295" stroke="#5a6b8a" stroke-width="1.4"/>
  <line x1="530" y1="265" x2="530" y2="295" stroke="#5a6b8a" stroke-width="1.4"/>

  <!-- From Заст. з тех. (cx=900) -->
  <line x1="900" y1="233" x2="900" y2="295" stroke="#5a6b8a" stroke-width="1.4"/>

  <!-- ============ LEVEL 2: Departments (y=295-345) ============ -->
  <!-- Служба перевезень (cx=170) -->
  <g transform="translate(85,295)">
    <rect x="0" y="0" width="170" height="50" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="85" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Служба перевезень</text>
    <text x="85" y="38" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">(маршрутні майстри)</text>
  </g>

  <!-- ДИСПЕТЧЕРСЬКА СЛУЖБА (cx=530, виділена) -->
  <g transform="translate(280,295)">
    <rect x="0" y="0" width="500" height="50" fill="#dfeaf7" stroke="#2c3958" stroke-width="2.2"/>
    <text x="250" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">ДИСПЕТЧЕРСЬКА СЛУЖБА</text>
    <text x="250" y="38" text-anchor="middle" font-size="10" font-style="italic" fill="#2c3958">основний користувач інформаційної системи «RoutePulse»</text>
  </g>

  <!-- Технічна служба (cx=900) -->
  <g transform="translate(815,295)">
    <rect x="0" y="0" width="170" height="50" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="85" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Технічна служба</text>
    <text x="85" y="38" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">(СТО, ремонтна зона)</text>
  </g>

  <!-- ============ Connectors L2 → L3 ============ -->
  <!-- From Служба перевезень (cx=170) -->
  <line x1="170" y1="345" x2="170" y2="380" stroke="#5a6b8a" stroke-width="1.4"/>
  <line x1="115" y1="380" x2="225" y2="380" stroke="#5a6b8a" stroke-width="1.4"/>
  <line x1="115" y1="380" x2="115" y2="410" stroke="#5a6b8a" stroke-width="1.4"/>
  <line x1="225" y1="380" x2="225" y2="410" stroke="#5a6b8a" stroke-width="1.4"/>

  <!-- From Disp service (cx=530, highlighted darker bar) -->
  <line x1="530" y1="345" x2="530" y2="380" stroke="#2c3958" stroke-width="1.8"/>
  <line x1="350" y1="380" x2="710" y2="380" stroke="#2c3958" stroke-width="1.8"/>
  <line x1="350" y1="380" x2="350" y2="410" stroke="#2c3958" stroke-width="1.6"/>
  <line x1="470" y1="380" x2="470" y2="410" stroke="#2c3958" stroke-width="1.6"/>
  <line x1="590" y1="380" x2="590" y2="410" stroke="#2c3958" stroke-width="1.6"/>
  <line x1="710" y1="380" x2="710" y2="410" stroke="#2c3958" stroke-width="1.6"/>

  <!-- From Тех. служба (cx=900) -->
  <line x1="900" y1="345" x2="900" y2="410" stroke="#5a6b8a" stroke-width="1.4"/>

  <!-- ============ LEVEL 3: Executive roles (y=410-470) ============ -->
  <!-- Under Служба перевезень -->
  <g transform="translate(55,410)">
    <rect x="0" y="0" width="120" height="56" fill="white" stroke="#5a6b8a" stroke-width="1.2"/>
    <text x="60" y="22" text-anchor="middle" font-size="11" fill="#2c3958">Маршрутні</text>
    <text x="60" y="38" text-anchor="middle" font-size="11" fill="#2c3958">майстри</text>
    <text x="60" y="52" text-anchor="middle" font-size="9" font-style="italic" fill="#5a6b8a">(розклад)</text>
  </g>

  <g transform="translate(165,410)">
    <rect x="0" y="0" width="120" height="56" fill="white" stroke="#5a6b8a" stroke-width="1.2"/>
    <text x="60" y="22" text-anchor="middle" font-size="11" fill="#2c3958">Водії</text>
    <text x="60" y="38" text-anchor="middle" font-size="9" font-style="italic" fill="#5a6b8a">(~150 осіб,</text>
    <text x="60" y="52" text-anchor="middle" font-size="9" font-style="italic" fill="#5a6b8a">користувачі мобільного</text>
  </g>

  <!-- Under DISP SERVICE: 4 roles -->
  <g transform="translate(290,410)">
    <rect x="0" y="0" width="120" height="70" fill="white" stroke="#2c3958" stroke-width="1.4"/>
    <text x="60" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Старший</text>
    <text x="60" y="38" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">диспетчер зміни</text>
    <text x="60" y="58" text-anchor="middle" font-size="9" font-style="italic" fill="#5a6b8a">координація зміни</text>
  </g>

  <g transform="translate(410,410)">
    <rect x="0" y="0" width="120" height="70" fill="white" stroke="#2c3958" stroke-width="1.4"/>
    <text x="60" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Диспетчер-</text>
    <text x="60" y="38" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">маршрутник</text>
    <text x="60" y="58" text-anchor="middle" font-size="9" font-style="italic" fill="#5a6b8a">моніторинг рейсів</text>
  </g>

  <g transform="translate(530,410)">
    <rect x="0" y="0" width="120" height="70" fill="white" stroke="#2c3958" stroke-width="1.4"/>
    <text x="60" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Диспетчер з</text>
    <text x="60" y="38" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">безпеки руху</text>
    <text x="60" y="58" text-anchor="middle" font-size="9" font-style="italic" fill="#5a6b8a">інциденти, ДТП</text>
  </g>

  <g transform="translate(650,410)">
    <rect x="0" y="0" width="120" height="70" fill="white" stroke="#2c3958" stroke-width="1.4"/>
    <text x="60" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Аналітик</text>
    <text x="60" y="38" text-anchor="middle" font-size="9" font-style="italic" fill="#5a6b8a">телеметрія, KPI,</text>
    <text x="60" y="52" text-anchor="middle" font-size="9" font-style="italic" fill="#5a6b8a">щотижневі звіти</text>
  </g>

  <!-- Under Тех. служба (1 child) -->
  <g transform="translate(820,410)">
    <rect x="0" y="0" width="160" height="56" fill="white" stroke="#5a6b8a" stroke-width="1.2"/>
    <text x="80" y="22" text-anchor="middle" font-size="11" fill="#2c3958">Сектор обслуговування</text>
    <text x="80" y="38" text-anchor="middle" font-size="11" fill="#2c3958">транспортних засобів</text>
    <text x="80" y="52" text-anchor="middle" font-size="9" font-style="italic" fill="#5a6b8a">(механіки, СТО)</text>
  </g>

  <!-- ============ Right-side info block: information flows ============ -->
  <g transform="translate(1010,295)">
    <rect x="0" y="0" width="260" height="265" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4" stroke-dasharray="2,2"/>
    <text x="130" y="22" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic" fill="#5a4a2a">Інформаційні потоки</text>
    <text x="130" y="38" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic" fill="#5a4a2a">навколо RoutePulse</text>

    <line x1="15" y1="50" x2="245" y2="50" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>

    <text x="10" y="70" font-size="11" font-weight="bold" fill="#2c3958">Входи в систему:</text>
    <text x="14" y="86" font-size="10" fill="#2c3958">— GPS-координати з мобільних</text>
    <text x="14" y="100" font-size="10" fill="#2c3958">— Дорожні листи (start/complete)</text>
    <text x="14" y="114" font-size="10" fill="#2c3958">— Звіти про інциденти (з фото)</text>
    <text x="14" y="128" font-size="10" fill="#2c3958">— Облікові дані водіїв</text>
    <text x="14" y="142" font-size="10" fill="#2c3958">— Маршрутні карти, зупинки</text>

    <line x1="15" y1="154" x2="245" y2="154" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>

    <text x="10" y="172" font-size="11" font-weight="bold" fill="#2c3958">Виходи системи:</text>
    <text x="14" y="188" font-size="10" fill="#2c3958">— Live-карта рухомого складу</text>
    <text x="14" y="202" font-size="10" fill="#2c3958">— Журнал інцидентів</text>
    <text x="14" y="216" font-size="10" fill="#2c3958">— Звіт про рух за зміну</text>
    <text x="14" y="230" font-size="10" fill="#2c3958">— Аналітичні KPI</text>
    <text x="14" y="244" font-size="10" fill="#2c3958">— Архів дорожніх листів</text>
  </g>

  <!-- Dashed arrow from disp service to info block -->
  <line x1="780" y1="320" x2="1010" y2="350" stroke="#5a6b8a" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="820" y="338" font-size="10" font-style="italic" fill="#5a6b8a">обслуговується системою</text>

  <!-- ============ Legend ============ -->
  <rect x="40" y="610" width="1200" height="80" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="50" y="628" font-size="11" font-weight="bold" font-style="italic" fill="#5a4a2a">Позначення:</text>

  <rect x="50" y="636" width="22" height="14" fill="#dfeaf7" stroke="#2c3958" stroke-width="2"/>
  <text x="80" y="648" font-size="11" fill="#5a4a2a">— підрозділ-користувач інформаційної системи диспетчеризації (виділений жирним бордером)</text>

  <rect x="50" y="656" width="22" height="14" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="80" y="668" font-size="11" fill="#5a4a2a">— керівний рівень / адміністративний підрозділ</text>

  <rect x="600" y="656" width="22" height="14" fill="white" stroke="#5a6b8a" stroke-width="1.2"/>
  <text x="630" y="668" font-size="11" fill="#5a4a2a">— виконавчий рівень / окрема посадова особа</text>

  <text x="50" y="682" font-size="10" font-style="italic" fill="#5a4a2a">Підпорядкування показано суцільними лініями (темніші — у межах диспетчерської ієрархії), інформаційні потоки до RoutePulse — пунктирними.</text>
</svg>
