<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2c3958"/>
    </marker>
  </defs>

  <text x="640" y="22" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 3.4. Загальна схема автоматизації — взаємодія компонентів Android · API-сервер · MongoDB</text>

  <!-- ============ EXTERNAL services (top row) ============ -->
  <g transform="translate(70,52)">
    <rect width="200" height="78" fill="#eef0f3" stroke="#7a8aac" stroke-width="1.4" stroke-dasharray="4,3"/>
    <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Супутникова GPS</text>
    <text x="100" y="40" text-anchor="middle" font-size="11" fill="#2c3958">(GLONASS / Galileo / GPS)</text>
    <text x="100" y="58" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">~28 космічних апаратів</text>
    <text x="100" y="72" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">L1/L5 радіосигнал, passive</text>
  </g>

  <g transform="translate(900,52)">
    <rect width="220" height="78" fill="#eef0f3" stroke="#7a8aac" stroke-width="1.4" stroke-dasharray="4,3"/>
    <text x="110" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">OpenStreetMap tile-server</text>
    <text x="110" y="40" text-anchor="middle" font-size="11" fill="#2c3958">https://tile.openstreetmap.org</text>
    <text x="110" y="58" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">растрові тайли (PNG, 256×256)</text>
    <text x="110" y="72" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">read-only публічна служба</text>
  </g>

  <text x="640" y="92" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic" fill="#5a6b8a">«External services»</text>

  <!-- =================== TIER 1: MOBILE CLIENT =================== -->
  <rect x="30" y="160" width="400" height="540" fill="none" stroke="#b89a5c" stroke-width="1.6"/>
  <rect x="30" y="160" width="400" height="34" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.6"/>
  <text x="230" y="183" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">«mobile tier» — клієнтський пристрій водія</text>

  <text x="230" y="218" text-anchor="middle" font-size="11" font-style="italic" fill="#5a6b8a">Smartphone / Tablet · Android 7.0+ (API 24) · ~150 пристроїв</text>

  <!-- RoutePulse app block -->
  <rect x="50" y="240" width="360" height="440" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="230" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">RoutePulse app (Kotlin / Jetpack Compose)</text>
  <line x1="60" y1="272" x2="400" y2="272" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- presentation -->
  <rect x="60" y="282" width="340" height="78" fill="white" stroke="#b89a5c" stroke-width="1.2"/>
  <text x="230" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">UI layer (Compose)</text>
  <text x="230" y="318" text-anchor="middle" font-size="10" fill="#2c3958">LoginScreen · HomeMenuScreen · RouteDashboardScreen</text>
  <text x="230" y="332" text-anchor="middle" font-size="10" fill="#2c3958">ActiveTripScreen · IncidentReportScreen · TripMapHubScreen</text>
  <text x="230" y="350" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">+ Material 3, Navigation Compose</text>

  <!-- domain/business -->
  <rect x="60" y="370" width="340" height="62" fill="white" stroke="#b89a5c" stroke-width="1.2"/>
  <text x="230" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Business logic (ViewModels + UseCases)</text>
  <text x="230" y="406" text-anchor="middle" font-size="10" fill="#2c3958">Login, ActiveTrip, IncidentReport, RouteDashboard VM</text>
  <text x="230" y="424" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">Repositories: Auth / Waybill / Incident / Route / Vehicle / TripMap</text>

  <!-- data access -->
  <rect x="60" y="442" width="340" height="78" fill="white" stroke="#b89a5c" stroke-width="1.2"/>
  <text x="230" y="460" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Data layer</text>
  <text x="230" y="478" text-anchor="middle" font-size="10" fill="#2c3958">ApiService (Retrofit) · OkHttp · Gson</text>
  <text x="230" y="494" text-anchor="middle" font-size="10" fill="#2c3958">SessionStore (DataStore) · EncryptedSharedPrefs (JWT)</text>
  <text x="230" y="510" text-anchor="middle" font-size="10" fill="#2c3958">Room LocalQueue (offline-черга телеметрії)</text>

  <!-- background services -->
  <rect x="60" y="530" width="340" height="74" fill="white" stroke="#b89a5c" stroke-width="1.2"/>
  <text x="230" y="548" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Background</text>
  <text x="230" y="566" text-anchor="middle" font-size="10" fill="#2c3958">LocationTrackingService (Foreground · FGS)</text>
  <text x="230" y="582" text-anchor="middle" font-size="10" fill="#2c3958">TelemetrySyncWorker (WorkManager · 15 хв)</text>
  <text x="230" y="598" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">FusedLocationProvider · OSMdroid</text>

  <!-- hardware -->
  <rect x="60" y="614" width="340" height="58" fill="#f0f6ec" stroke="#7a9a7a" stroke-width="1.2"/>
  <text x="230" y="632" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Hardware</text>
  <text x="230" y="650" text-anchor="middle" font-size="10" fill="#2c3958">GPS-приймач · Camera · WiFi / 4G / 5G модем</text>
  <text x="230" y="664" text-anchor="middle" font-size="10" fill="#2c3958">CPU (Snapdragon / Exynos) · 2-4 GB RAM</text>

  <!-- =================== TIER 2: API SERVER =================== -->
  <rect x="480" y="160" width="380" height="540" fill="none" stroke="#5a6b8a" stroke-width="1.6"/>
  <rect x="480" y="160" width="380" height="34" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.6"/>
  <text x="670" y="183" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">«application server tier» — API-сервер</text>

  <text x="670" y="218" text-anchor="middle" font-size="11" font-style="italic" fill="#5a6b8a">Linux VPS / private cloud · Node.js 18+ · TCP 3000 (HTTPS)</text>

  <!-- API server block -->
  <rect x="500" y="240" width="340" height="440" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="670" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Node.js + Express API</text>
  <line x1="510" y1="272" x2="830" y2="272" stroke="#5a6b8a" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- HTTP layer -->
  <rect x="510" y="282" width="320" height="62" fill="white" stroke="#5a6b8a" stroke-width="1.2"/>
  <text x="670" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">HTTP layer (Express)</text>
  <text x="670" y="318" text-anchor="middle" font-size="10" fill="#2c3958">/api/auth · /api/routes · /api/waybills</text>
  <text x="670" y="335" text-anchor="middle" font-size="10" fill="#2c3958">/api/incidents · /api/telemetry · /api/map · /api/vehicles</text>

  <!-- middleware -->
  <rect x="510" y="354" width="320" height="48" fill="white" stroke="#5a6b8a" stroke-width="1.2"/>
  <text x="670" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Middleware</text>
  <text x="670" y="390" text-anchor="middle" font-size="10" fill="#2c3958">requireAuth (JWT verify) · express-validator · cors · json(12mb)</text>

  <!-- controllers -->
  <rect x="510" y="412" width="320" height="78" fill="white" stroke="#5a6b8a" stroke-width="1.2"/>
  <text x="670" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Controllers (бізнес-логіка)</text>
  <text x="670" y="448" text-anchor="middle" font-size="10" fill="#2c3958">authController · waybillController · incidentController</text>
  <text x="670" y="463" text-anchor="middle" font-size="10" fill="#2c3958">routeController · telemetryController · mapController · vehicleController</text>
  <text x="670" y="481" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">+ bcrypt (cost 10), jsonwebtoken (HS256, 8h)</text>

  <!-- ORM -->
  <rect x="510" y="500" width="320" height="58" fill="white" stroke="#5a6b8a" stroke-width="1.2"/>
  <text x="670" y="518" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">ORM + models</text>
  <text x="670" y="536" text-anchor="middle" font-size="10" fill="#2c3958">Mongoose schemas: Driver, Vehicle, Route,</text>
  <text x="670" y="550" text-anchor="middle" font-size="10" fill="#2c3958">Waybill, Incident, Telemetry</text>

  <!-- File storage -->
  <rect x="510" y="568" width="320" height="46" fill="white" stroke="#5a6b8a" stroke-width="1.2"/>
  <text x="670" y="586" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">File storage</text>
  <text x="670" y="604" text-anchor="middle" font-size="10" fill="#2c3958">/uploads/&lt;uuid&gt;.jpg · static-route /uploads (Express)</text>

  <!-- OS -->
  <rect x="510" y="624" width="320" height="42" fill="#f0f6ec" stroke="#7a9a7a" stroke-width="1.2"/>
  <text x="670" y="644" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">OS / Runtime</text>
  <text x="670" y="660" text-anchor="middle" font-size="10" fill="#2c3958">Ubuntu Server 22.04 LTS · Node.js 18 · PM2 / systemd</text>

  <!-- =================== TIER 3: MONGODB =================== -->
  <rect x="910" y="160" width="340" height="540" fill="none" stroke="#5a6b8a" stroke-width="1.6"/>
  <rect x="910" y="160" width="340" height="34" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.6"/>
  <text x="1080" y="183" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">«data tier» — MongoDB Server</text>

  <text x="1080" y="218" text-anchor="middle" font-size="11" font-style="italic" fill="#5a6b8a">MongoDB 6.x · localhost:27017 (private network)</text>

  <!-- DB block -->
  <rect x="930" y="240" width="300" height="440" fill="#f0f6ec" stroke="#7a9a7a" stroke-width="1.4"/>
  <text x="1080" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Database: routepulse_db</text>
  <line x1="940" y1="272" x2="1220" y2="272" stroke="#7a9a7a" stroke-width="0.8" stroke-dasharray="3,3"/>

  <g transform="translate(940,282)">
    <rect width="280" height="40" fill="white" stroke="#7a9a7a" stroke-width="1.2"/>
    <text x="14" y="18" font-size="11" font-weight="bold" fill="#2c3958">drivers</text>
    <text x="14" y="33" font-size="10" font-style="italic" fill="#5a6b8a">{driver_id:1} unique</text>
  </g>
  <g transform="translate(940,328)">
    <rect width="280" height="40" fill="white" stroke="#7a9a7a" stroke-width="1.2"/>
    <text x="14" y="18" font-size="11" font-weight="bold" fill="#2c3958">vehicles</text>
    <text x="14" y="33" font-size="10" font-style="italic" fill="#5a6b8a">{vehicle_id:1} unique</text>
  </g>
  <g transform="translate(940,374)">
    <rect width="280" height="40" fill="white" stroke="#7a9a7a" stroke-width="1.2"/>
    <text x="14" y="18" font-size="11" font-weight="bold" fill="#2c3958">routes</text>
    <text x="14" y="33" font-size="10" font-style="italic" fill="#5a6b8a">+ embedded stops[ ]</text>
  </g>
  <g transform="translate(940,420)">
    <rect width="280" height="40" fill="white" stroke="#7a9a7a" stroke-width="1.2"/>
    <text x="14" y="18" font-size="11" font-weight="bold" fill="#2c3958">waybills</text>
    <text x="14" y="33" font-size="10" font-style="italic" fill="#5a6b8a">{driver_id:1}</text>
  </g>
  <g transform="translate(940,466)">
    <rect width="280" height="40" fill="white" stroke="#7a9a7a" stroke-width="1.2"/>
    <text x="14" y="18" font-size="11" font-weight="bold" fill="#2c3958">incidents</text>
    <text x="14" y="33" font-size="10" font-style="italic" fill="#5a6b8a">+ version_history[ ], soft-delete</text>
  </g>
  <g transform="translate(940,512)">
    <rect width="280" height="40" fill="white" stroke="#7a9a7a" stroke-width="1.2"/>
    <text x="14" y="18" font-size="11" font-weight="bold" fill="#2c3958">telemetry</text>
    <text x="14" y="33" font-size="10" font-style="italic" fill="#5a6b8a">{waybill_id:1}, {driver_id:1}</text>
  </g>

  <line x1="940" y1="568" x2="1220" y2="568" stroke="#7a9a7a" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="1080" y="586" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Storage engine</text>
  <text x="1080" y="603" text-anchor="middle" font-size="10" fill="#2c3958">WiredTiger (snapshot + journal)</text>
  <text x="1080" y="619" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">Replication / Backup: mongodump cron</text>

  <line x1="940" y1="628" x2="1220" y2="628" stroke="#7a9a7a" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="1080" y="646" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">OS</text>
  <text x="1080" y="663" text-anchor="middle" font-size="10" fill="#2c3958">Ubuntu Server (same as API node)</text>

  <!-- =================== CONNECTIONS =================== -->

  <!-- GPS → Mobile -->
  <line x1="170" y1="130" x2="170" y2="158" stroke="#2c3958" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="178" y="148" font-size="9" font-style="italic" fill="#5a6b8a">L1/L5</text>

  <!-- OSM → Mobile (long diagonal up-right to bottom-left) -->
  <line x1="1010" y1="130" x2="340" y2="158" stroke="#2c3958" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="500" y="143" font-size="9" font-style="italic" fill="#5a6b8a">HTTPS · GET tile/{z}/{x}/{y}.png</text>

  <!-- Mobile ↔ API server (horizontal) -->
  <line x1="430" y1="420" x2="480" y2="420" stroke="#2c3958" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="480" y1="445" x2="430" y2="445" stroke="#2c3958" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <rect x="385" y="370" width="170" height="42" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="470" y="386" text-anchor="middle" font-size="10" font-weight="bold" fill="#5a4a2a">HTTPS · TLS 1.2+</text>
  <text x="470" y="401" text-anchor="middle" font-size="10" font-style="italic" fill="#5a4a2a">REST · JSON · JWT (HS256)</text>

  <!-- API ↔ MongoDB (horizontal) -->
  <line x1="860" y1="420" x2="910" y2="420" stroke="#2c3958" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="910" y1="445" x2="860" y2="445" stroke="#2c3958" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <rect x="815" y="370" width="170" height="42" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="900" y="386" text-anchor="middle" font-size="10" font-weight="bold" fill="#5a4a2a">TCP 27017</text>
  <text x="900" y="401" text-anchor="middle" font-size="10" font-style="italic" fill="#5a4a2a">Mongoose driver · BSON</text>

  <!-- =================== Bottom legend =================== -->
  <rect x="30" y="715" width="1220" height="34" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="40" y="734" font-size="11" font-weight="bold" font-style="italic" fill="#5a4a2a">Узгодженість зі схемами 03 (class), 09–10 (ER) та послідовностями 04–08:</text>
  <text x="40" y="747" font-size="10" font-style="italic" fill="#5a4a2a">Mobile-tier ↔ Client Tier (Compose екрани + ViewModels + Repositories);  API-tier ↔ Application Server Tier (Controllers);  Data-tier ↔ Data Tier (6 колекцій MongoDB).</text>
</svg>
