    <line x1="10" y1="28" x2="250" y2="28" stroke="#7a9a7a" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="46" font-size="11" font-weight="bold" fill="#2c3958">— Сервер:</text>
    <text x="20" y="62" font-size="11" fill="#2c3958">UFW (firewall)</text>
    <text x="20" y="78" font-size="11" fill="#2c3958">Fail2ban</text>
    <text x="20" y="94" font-size="11" fill="#2c3958">ClamAV (антивірус)</text>
    <text x="20" y="110" font-size="11" fill="#2c3958">logrotate, journald</text>
    <text x="10" y="128" font-size="11" font-weight="bold" fill="#2c3958">— Моніторинг:</text>
    <text x="20" y="144" font-size="11" fill="#2c3958">Prometheus + Grafana</text>
    <text x="20" y="160" font-size="11" fill="#2c3958">або Uptime Kuma</text>
    <text x="10" y="178" font-size="11" font-weight="bold" fill="#2c3958">— Бекапи:</text>
    <text x="20" y="194" font-size="11" fill="#2c3958">cron + mongodump → NAS</text>
  </g>

