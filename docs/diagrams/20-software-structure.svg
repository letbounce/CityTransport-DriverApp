  <text x="640" y="22" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 3.8. Структура програмного забезпечення інформаційної підсистеми «Мобільний термінал водія» (RoutePulse)</text>

  <!-- =================== ROOT =================== -->
  <rect x="440" y="46" width="400" height="50" fill="#dfeaf7" stroke="#2c3958" stroke-width="2"/>
  <text x="640" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">Програмне забезпечення RoutePulse</text>
  <text x="640" y="86" text-anchor="middle" font-size="11" font-style="italic" fill="#5a6b8a">Android-клієнт + Node.js/MongoDB бекенд</text>

  <!-- Connector vertical + horizontal bar -->
  <line x1="640" y1="96" x2="640" y2="120" stroke="#2c3958" stroke-width="1.6"/>
  <line x1="165" y1="120" x2="1115" y2="120" stroke="#2c3958" stroke-width="1.6"/>
  <line x1="165" y1="120" x2="165" y2="146" stroke="#2c3958" stroke-width="1.6"/>
  <line x1="475" y1="120" x2="475" y2="146" stroke="#2c3958" stroke-width="1.6"/>
  <line x1="805" y1="120" x2="805" y2="146" stroke="#2c3958" stroke-width="1.6"/>
  <line x1="1115" y1="120" x2="1115" y2="146" stroke="#2c3958" stroke-width="1.6"/>

  <!-- ============== COL 1: Системне ПЗ ============== -->
