    <text x="10" y="46" font-size="11" font-weight="bold" fill="#2c3958">— ОС:</text>
    <text x="20" y="62" font-size="11" fill="#2c3958">Android 7.0+ (API 24+)</text>
    <text x="20" y="78" font-size="11" fill="#2c3958">target SDK 36 (Android 14)</text>
    <text x="10" y="96" font-size="11" font-weight="bold" fill="#2c3958">— Runtime:</text>
    <text x="20" y="112" font-size="11" fill="#2c3958">ART (Android Runtime)</text>
    <text x="20" y="128" font-size="11" fill="#2c3958">+ Kotlin 1.9+ / JVM 11</text>
    <text x="10" y="146" font-size="11" font-weight="bold" fill="#2c3958">— Сервісні бібліотеки ОС:</text>
    <text x="20" y="162" font-size="11" fill="#2c3958">Google Play Services</text>
    <text x="20" y="178" font-size="11" fill="#2c3958">(GPS, Camera Intent, FCM)</text>
    <text x="20" y="194" font-size="11" fill="#2c3958">+ Material Components 3</text>
  </g>

  <!-- Diagnostic / utility -->
  <g transform="translate(35,634)">
