  <rect x="20" y="146" width="290" height="36" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="165" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">1. Системне ПЗ</text>

  <!-- Server-side system -->
  <g transform="translate(35,194)">
    <rect width="260" height="220" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.2"/>
    <text x="130" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Серверна частина</text>
    <line x1="10" y1="28" x2="250" y2="28" stroke="#5a6b8a" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="46" font-size="11" font-weight="bold" fill="#2c3958">— ОС:</text>
    <text x="20" y="62" font-size="11" fill="#2c3958">Ubuntu Server 22.04 LTS</text>
    <text x="10" y="80" font-size="11" font-weight="bold" fill="#2c3958">— Runtime:</text>
    <text x="20" y="96" font-size="11" fill="#2c3958">Node.js 18 LTS</text>
    <text x="20" y="112" font-size="11" fill="#2c3958">+ npm 9 / package manager</text>
    <text x="10" y="130" font-size="11" font-weight="bold" fill="#2c3958">— СКБД:</text>
    <text x="20" y="146" font-size="11" fill="#2c3958">MongoDB 6.x (WiredTiger)</text>
    <text x="10" y="164" font-size="11" font-weight="bold" fill="#2c3958">— Process manager:</text>
    <text x="20" y="180" font-size="11" fill="#2c3958">PM2 / systemd (auto-restart)</text>
    <text x="10" y="198" font-size="11" font-weight="bold" fill="#2c3958">— Reverse-proxy:</text>
    <text x="20" y="214" font-size="11" fill="#2c3958">nginx (TLS, gzip)</text>
  </g>

  <!-- Client-side system -->
  <g transform="translate(35,424)">
    <rect width="260" height="200" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.2"/>
    <text x="130" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Клієнтська частина</text>
