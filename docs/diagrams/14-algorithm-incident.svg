<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2c3958"/>
    </marker>
  </defs>

  <text x="500" y="24" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 2.11. Схема алгоритму обробки інциденту (за ДСТУ 19.701-90)</text>

  <!-- ===================== 1. START (термінатор) ===================== -->
  <rect x="380" y="50" width="160" height="44" rx="22" ry="22" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.6"/>
  <text x="460" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Початок</text>
  <line x1="460" y1="94" x2="460" y2="118" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===================== 2. ВВІД ДАНИХ (паралелограм) ===================== -->
  <path d="M310,120 L590,120 L560,170 L280,170 Z" fill="#eaf3eb" stroke="#7a9a7a" stroke-width="1.4"/>
  <text x="435" y="140" text-anchor="middle" font-size="12" fill="#2c3958">Ввід: тип, опис, координати,</text>
  <text x="435" y="158" text-anchor="middle" font-size="12" fill="#2c3958">час, обрана зупинка, фото</text>

  <line x1="425" y1="170" x2="425" y2="195" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===================== 3. DECISION "Зробити фото?" ===================== -->
  <path d="M425,195 L520,245 L425,295 L330,245 Z" fill="#fffce8" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="425" y="240" text-anchor="middle" font-size="11" fill="#2c3958">Робити</text>
  <text x="425" y="255" text-anchor="middle" font-size="11" fill="#2c3958">фото?</text>

  <!-- yes branch (right) -->
  <line x1="520" y1="245" x2="700" y2="245" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="700" y1="245" x2="700" y2="278" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="528" y="237" font-size="10" font-style="italic" fill="#5a6b8a">[так]</text>

  <!-- 3a. Capture from camera (process) -->
  <rect x="620" y="278" width="160" height="40" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="700" y="293" text-anchor="middle" font-size="11" fill="#2c3958">Запустити камеру:</text>
  <text x="700" y="308" text-anchor="middle" font-size="11" fill="#2c3958">ACTION_IMAGE_CAPTURE</text>

  <line x1="700" y1="318" x2="700" y2="343" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 3b. Encode to Base64 (process) -->
  <rect x="620" y="343" width="160" height="40" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="700" y="358" text-anchor="middle" font-size="11" fill="#2c3958">Bitmap → JPEG →</text>
  <text x="700" y="373" text-anchor="middle" font-size="11" fill="#2c3958">Base64 (photo_base64)</text>

  <line x1="700" y1="383" x2="700" y2="425" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="700" y1="425" x2="430" y2="425" stroke="#2c3958" stroke-width="1.4"/>

  <!-- no branch (down) -->
  <line x1="425" y1="295" x2="425" y2="425" stroke="#2c3958" stroke-width="1.4"/>
  <text x="396" y="312" font-size="10" font-style="italic" fill="#5a6b8a">[ні]</text>

  <!-- merge dot -->
  <circle cx="425" cy="425" r="3" fill="#2c3958"/>

  <line x1="425" y1="425" x2="425" y2="455" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===================== 4. DECISION "Опис не порожній?" ===================== -->
  <path d="M425,455 L535,510 L425,565 L315,510 Z" fill="#fffce8" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="425" y="505" text-anchor="middle" font-size="11" fill="#2c3958">description.trim()</text>
  <text x="425" y="520" text-anchor="middle" font-size="11" fill="#2c3958">не порожній?</text>

  <!-- no branch → error -->
  <line x1="535" y1="510" x2="640" y2="510" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="540" y="502" font-size="10" font-style="italic" fill="#5a6b8a">[ні]</text>

  <!-- Output error: empty description -->
  <path d="M650,490 L890,490 L860,530 L620,530 Z" fill="#fdf3f3" stroke="#c97070" stroke-width="1.4"/>
  <text x="755" y="514" text-anchor="middle" font-size="11" fill="#7a3a3a">Вивід: «Заповніть опис інциденту»</text>

  <!-- back loop from error1 -->
  <line x1="890" y1="510" x2="940" y2="510" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="940" y1="510" x2="940" y2="145" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="940" y1="145" x2="590" y2="145" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="948" y="330" font-size="10" font-style="italic" fill="#5a6b8a">повторне редагування</text>

  <!-- yes branch down -->
  <line x1="425" y1="565" x2="425" y2="600" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="436" y="582" font-size="10" font-style="italic" fill="#5a6b8a">[так]</text>

  <!-- ===================== 5. DECISION "Зупинку обрано?" ===================== -->
  <path d="M425,600 L535,655 L425,710 L315,655 Z" fill="#fffce8" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="425" y="650" text-anchor="middle" font-size="11" fill="#2c3958">selectedStop</text>
  <text x="425" y="665" text-anchor="middle" font-size="11" fill="#2c3958">обрано?</text>

  <!-- no branch → error 2 -->
  <line x1="535" y1="655" x2="640" y2="655" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="540" y="647" font-size="10" font-style="italic" fill="#5a6b8a">[ні]</text>
  <path d="M650,635 L890,635 L860,675 L620,675 Z" fill="#fdf3f3" stroke="#c97070" stroke-width="1.4"/>
  <text x="755" y="659" text-anchor="middle" font-size="11" fill="#7a3a3a">Вивід: «Оберіть зупинку маршруту»</text>

  <!-- back loop from error2 to input -->
  <line x1="890" y1="655" x2="960" y2="655" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="960" y1="655" x2="960" y2="155" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="960" y1="155" x2="590" y2="158" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- yes branch down -->
  <line x1="425" y1="710" x2="425" y2="745" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="436" y="727" font-size="10" font-style="italic" fill="#5a6b8a">[так]</text>

  <!-- ===================== 6. Form payload (process) ===================== -->
  <rect x="310" y="745" width="230" height="44" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="425" y="767" text-anchor="middle" font-size="11" fill="#2c3958">Сформувати NewIncidentPayload</text>
  <text x="425" y="781" text-anchor="middle" font-size="11" fill="#2c3958">(waybillId, type, body, geo, photo)</text>

  <line x1="425" y1="789" x2="425" y2="815" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===================== 7. POST /api/incidents (predefined process — double bars) ===================== -->
  <rect x="310" y="815" width="230" height="44" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <line x1="322" y1="815" x2="322" y2="859" stroke="#b89a5c" stroke-width="1.4"/>
  <line x1="528" y1="815" x2="528" y2="859" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="425" y="837" text-anchor="middle" font-size="11" fill="#2c3958">POST /api/incidents</text>
  <text x="425" y="851" text-anchor="middle" font-size="11" fill="#2c3958">(HTTPS + JWT, ApiService)</text>

  <line x1="425" y1="859" x2="425" y2="888" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===================== 8. DECISION "HTTP 201?" ===================== -->
  <path d="M425,888 L535,940 L425,992 L315,940 Z" fill="#fffce8" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="425" y="935" text-anchor="middle" font-size="11" fill="#2c3958">HTTP 201</text>
  <text x="425" y="950" text-anchor="middle" font-size="11" fill="#2c3958">Created?</text>

  <!-- no branch → error end -->
  <line x1="535" y1="940" x2="640" y2="940" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="540" y="932" font-size="10" font-style="italic" fill="#5a6b8a">[ні]</text>
  <path d="M650,920 L890,920 L860,960 L620,960 Z" fill="#fdf3f3" stroke="#c97070" stroke-width="1.4"/>
  <text x="755" y="945" text-anchor="middle" font-size="11" fill="#7a3a3a">Вивід: «Помилка зв'язку з сервером»</text>

  <line x1="755" y1="960" x2="755" y2="1010" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="675" y="1010" width="160" height="44" rx="22" ry="22" fill="#fdeaea" stroke="#c97070" stroke-width="1.6"/>
  <text x="755" y="1037" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a3a3a">Кінець (помилка)</text>

  <!-- yes branch down to storage -->
  <line x1="425" y1="992" x2="425" y2="1020" stroke="#2c3958" stroke-width="1.4"/>
  <text x="436" y="1010" font-size="10" font-style="italic" fill="#5a6b8a">[так]</text>

  <!-- Connector circle (because we'll redirect) — bottom continuation -->
  <circle cx="425" cy="1023" r="3" fill="#2c3958"/>

  <!-- ===================== Left-side success continuation block ===================== -->
  <!-- We split into bottom-left column to fit. Actually keep going down. -->
  <line x1="425" y1="1023" x2="180" y2="1023" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="180" y1="1023" x2="180" y2="450" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 9. Storage symbol: Incident saved to MongoDB -->
  <path d="M70,450 L255,450 Q270,465 255,480 L70,480 Q85,465 70,450 Z" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="162" y="468" text-anchor="middle" font-size="11" fill="#2c3958">Server: Incident.create() →</text>
  <text x="162" y="482" text-anchor="middle" font-size="11" fill="#2c3958">MongoDB incidents</text>

  <line x1="162" y1="450" x2="162" y2="420" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 10. Update VM state -->
  <rect x="75" y="370" width="180" height="44" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="165" y="390" text-anchor="middle" font-size="11" fill="#2c3958">Update VM state:</text>
  <text x="165" y="406" text-anchor="middle" font-size="11" fill="#2c3958">uiState.submitted = true</text>

  <line x1="165" y1="370" x2="165" y2="340" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 11. Return to ActiveTripScreen -->
  <rect x="75" y="295" width="180" height="44" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="165" y="315" text-anchor="middle" font-size="11" fill="#2c3958">popBack() → повернутися</text>
  <text x="165" y="331" text-anchor="middle" font-size="11" fill="#2c3958">на ActiveTripScreen</text>

  <line x1="165" y1="295" x2="165" y2="265" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 12. END (terminator) -->
  <rect x="85" y="220" width="160" height="44" rx="22" ry="22" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.6"/>
  <text x="165" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Кінець (успіх)</text>

  <!-- Legend -->
  <rect x="60" y="1040" width="550" height="34" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="68" y="1054" font-size="10" font-weight="bold" font-style="italic" fill="#5a4a2a">Позначення (ДСТУ 19.701-90):</text>
  <text x="68" y="1068" font-size="10" font-style="italic" fill="#5a4a2a">овал — термінатор; прямокутник — процес; ромб — рішення; паралелограм — І/В; D-форма — носій даних.</text>
</svg>
