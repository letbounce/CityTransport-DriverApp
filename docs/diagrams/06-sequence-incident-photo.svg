<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="filled-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2c3958"/>
    </marker>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#2c3958" stroke-width="1.4"/>
    </marker>
  </defs>

  <text x="600" y="24" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 2.7. Діаграма послідовності для сценарію «Реєстрація інциденту з фотофіксацією»</text>

  <g transform="translate(80,52)">
    <circle cx="0" cy="0" r="10" fill="#f4e7c8" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="10" x2="0" y2="40" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="-16" y1="22" x2="16" y2="22" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="40" x2="-14" y2="62" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="40" x2="14" y2="62" stroke="#7a6a4a" stroke-width="1.4"/>
    <text x="0" y="82" text-anchor="middle" font-size="13" fill="#2c3958">:Водій</text>
  </g>

  <rect x="172" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="240" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:IncidentReportScreen</text>

  <rect x="332" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="400" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:IncidentReportVM</text>

  <rect x="492" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="560" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:IncidentRepository</text>

  <rect x="652" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="720" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:ApiService (Retrofit)</text>

  <rect x="822" y="92" width="136" height="32" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="890" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:IncidentController</text>

  <rect x="992" y="92" width="136" height="32" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="1060" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:MongoDB (incidents)</text>

  <line x1="800" y1="40" x2="800" y2="750" stroke="#bcc6da" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="813" y="42" font-size="10" fill="#7a8aac" font-style="italic">Server side</text>

  <!-- Lifelines -->
  <line x1="80" y1="124" x2="80" y2="750" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="240" y1="124" x2="240" y2="750" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="400" y1="124" x2="400" y2="750" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="560" y1="124" x2="560" y2="750" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="720" y1="124" x2="720" y2="750" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="890" y1="124" x2="890" y2="750" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1060" y1="124" x2="1060" y2="750" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Phase A: photo capture -->
  <rect x="180" y="142" width="880" height="22" fill="#eaf3eb" stroke="#7a9a7a" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="190" y="158" font-size="11" font-style="italic" fill="#3a6a3a">Фаза А — Захоплення фото</text>

  <rect x="236" y="180" width="8" height="105" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="396" y="240" width="8" height="50" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>

  <line x1="82" y1="180" x2="236" y2="180" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="159" y="174" text-anchor="middle" font-size="11" fill="#2c3958">1: tap "Зробити фото"</text>

  <!-- self message on Screen: camera intent -->
  <path d="M244,210 C290,205 290,225 244,225" fill="none" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="298" y="220" font-size="11" fill="#2c3958">2: ACTION_IMAGE_CAPTURE → bitmap</text>

  <line x1="244" y1="250" x2="396" y2="250" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="320" y="244" text-anchor="middle" font-size="11" fill="#2c3958">3: setPhoto(bitmap)</text>

  <rect x="408" y="263" width="220" height="22" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="518" y="278" text-anchor="middle" font-size="10" font-style="italic" fill="#5a4a2a">bitmap → JPEG → Base64 (data URI)</text>

  <!-- Phase B: submit -->
  <rect x="180" y="305" width="880" height="22" fill="#eaf3eb" stroke="#7a9a7a" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="190" y="321" font-size="11" font-style="italic" fill="#3a6a3a">Фаза Б — Відправка звіту</text>

  <rect x="236" y="345" width="8" height="295" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="396" y="375" width="8" height="245" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="556" y="405" width="8" height="185" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="716" y="435" width="8" height="125" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="886" y="465" width="8" height="65" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="1056" y="495" width="8" height="32" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>

  <line x1="82" y1="345" x2="236" y2="345" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="159" y="339" text-anchor="middle" font-size="11" fill="#2c3958">4: tap "ВІДПРАВИТИ ЗВІТ"</text>

  <line x1="244" y1="375" x2="396" y2="375" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="320" y="369" text-anchor="middle" font-size="11" fill="#2c3958">5: submit(waybillId)</text>

  <line x1="404" y1="405" x2="556" y2="405" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="480" y="399" text-anchor="middle" font-size="11" fill="#2c3958">6: reportIncident(payload)</text>

  <line x1="564" y1="435" x2="716" y2="435" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="640" y="429" text-anchor="middle" font-size="11" fill="#2c3958">7: POST /api/incidents</text>

  <line x1="724" y1="465" x2="886" y2="465" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="805" y="459" text-anchor="middle" font-size="11" fill="#2c3958">8: HTTPS POST {photo_base64, body}</text>

  <rect x="820" y="478" width="220" height="22" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="930" y="493" text-anchor="middle" font-size="10" font-style="italic" fill="#5a4a2a">saveBase64ToJpeg → /uploads/&lt;uuid&gt;.jpg</text>

  <line x1="894" y1="520" x2="1056" y2="520" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="975" y="514" text-anchor="middle" font-size="11" fill="#2c3958">9: Incident.create({photo_url, ...})</text>

  <line x1="1056" y1="550" x2="894" y2="550" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="975" y="544" text-anchor="middle" font-size="11" fill="#4a5b7a">10: Incident{_id, status:"open"}</text>

  <line x1="886" y1="580" x2="724" y2="580" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="805" y="574" text-anchor="middle" font-size="11" fill="#4a5b7a">11: 201 IncidentDto</text>

  <line x1="716" y1="610" x2="404" y2="610" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="560" y="604" text-anchor="middle" font-size="11" fill="#4a5b7a">12: Result.Success(IncidentItem)</text>

  <line x1="396" y1="640" x2="244" y2="640" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="320" y="634" text-anchor="middle" font-size="11" fill="#2c3958">13: emit(uiState.copy(submitted=true))</text>

  <line x1="236" y1="670" x2="92" y2="670" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="160" y="664" text-anchor="middle" font-size="11" fill="#4a5b7a">14: popBack → ActiveTripScreen</text>

  <rect x="180" y="700" width="800" height="40" fill="#fdf3f3" stroke="#c97070" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="580" y="716" text-anchor="middle" font-size="10" font-style="italic" fill="#7a3a3a">alt [empty description / стоп не обраний / Base64 пошкоджений]: VM зберігає error без виклику</text>
  <text x="580" y="731" text-anchor="middle" font-size="10" font-style="italic" fill="#7a3a3a">мережі; Controller відповідає 400 Bad Request → Result.failure → user error message.</text>
</svg>
