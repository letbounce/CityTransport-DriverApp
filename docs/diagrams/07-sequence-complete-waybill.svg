<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="filled-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2c3958"/>
    </marker>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#2c3958" stroke-width="1.4"/>
    </marker>
  </defs>

  <text x="600" y="24" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 2.8. Діаграма послідовності для сценарію «Завершення / архівування дорожнього листа»</text>

  <g transform="translate(80,52)">
    <circle cx="0" cy="0" r="10" fill="#f4e7c8" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="10" x2="0" y2="40" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="-16" y1="22" x2="16" y2="22" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="40" x2="-14" y2="62" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="40" x2="14" y2="62" stroke="#7a6a4a" stroke-width="1.4"/>
    <text x="0" y="82" text-anchor="middle" font-size="13" fill="#2c3958">:Водій</text>
  </g>

  <rect x="172" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="240" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:ActiveTripScreen</text>

  <rect x="332" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="400" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:ActiveTripViewModel</text>

  <rect x="492" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="560" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:WaybillRepository</text>

  <rect x="652" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="720" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:ApiService (Retrofit)</text>

  <rect x="822" y="92" width="136" height="32" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="890" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:WaybillController</text>

  <rect x="992" y="92" width="136" height="32" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="1060" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:MongoDB (waybills)</text>

  <line x1="800" y1="40" x2="800" y2="690" stroke="#bcc6da" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="813" y="42" font-size="10" fill="#7a8aac" font-style="italic">Server side</text>

  <line x1="80" y1="124" x2="80" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="240" y1="124" x2="240" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="400" y1="124" x2="400" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="560" y1="124" x2="560" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="720" y1="124" x2="720" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="890" y1="124" x2="890" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1060" y1="124" x2="1060" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>

  <rect x="236" y="160" width="8" height="445" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="396" y="220" width="8" height="355" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="556" y="250" width="8" height="295" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="716" y="280" width="8" height="235" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="886" y="310" width="8" height="175" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="1056" y="340" width="8" height="100" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>

  <line x1="82" y1="160" x2="236" y2="160" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="159" y="154" text-anchor="middle" font-size="11" fill="#2c3958">1: tap "ЗАВЕРШИТИ РЕЙС"</text>

  <!-- self-message: show confirm dialog -->
  <path d="M244,190 C290,185 290,205 244,205" fill="none" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="298" y="200" font-size="11" fill="#2c3958">2: showConfirmDialog()</text>

  <line x1="82" y1="220" x2="236" y2="220" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="159" y="214" text-anchor="middle" font-size="11" fill="#2c3958">3: confirm "Так"</text>

  <line x1="244" y1="250" x2="396" y2="250" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="320" y="244" text-anchor="middle" font-size="11" fill="#2c3958">4: completeWaybill(id)</text>

  <line x1="404" y1="280" x2="556" y2="280" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="480" y="274" text-anchor="middle" font-size="11" fill="#2c3958">5: complete(id)</text>

  <line x1="564" y1="310" x2="716" y2="310" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="640" y="304" text-anchor="middle" font-size="11" fill="#2c3958">6: PATCH /api/waybills/&#123;id&#125;/complete</text>

  <line x1="724" y1="340" x2="886" y2="340" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="805" y="334" text-anchor="middle" font-size="11" fill="#2c3958">7: HTTPS PATCH {JWT}</text>

  <line x1="894" y1="370" x2="1056" y2="370" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="975" y="364" text-anchor="middle" font-size="11" fill="#2c3958">8: findOne({_id, status:in_progress})</text>

  <line x1="1056" y1="400" x2="894" y2="400" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="975" y="394" text-anchor="middle" font-size="11" fill="#4a5b7a">9: Waybill document</text>

  <rect x="820" y="412" width="220" height="22" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="930" y="427" text-anchor="middle" font-size="10" font-style="italic" fill="#5a4a2a">status="completed"; completed_at=now()</text>

  <line x1="894" y1="455" x2="1056" y2="455" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="975" y="449" text-anchor="middle" font-size="11" fill="#2c3958">10: save()</text>

  <line x1="886" y1="485" x2="724" y2="485" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="805" y="479" text-anchor="middle" font-size="11" fill="#4a5b7a">11: 200 WaybillDto</text>

  <line x1="716" y1="515" x2="564" y2="515" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="640" y="509" text-anchor="middle" font-size="11" fill="#4a5b7a">12: Waybill</text>

  <line x1="556" y1="545" x2="404" y2="545" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="480" y="539" text-anchor="middle" font-size="11" fill="#4a5b7a">13: Result.Success</text>

  <line x1="396" y1="575" x2="244" y2="575" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="320" y="569" text-anchor="middle" font-size="11" fill="#2c3958">14: stopLocationTrackingService()</text>

  <line x1="236" y1="605" x2="92" y2="605" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="160" y="599" text-anchor="middle" font-size="11" fill="#4a5b7a">15: navigateTo(HomeMenu)</text>

  <rect x="180" y="635" width="800" height="50" fill="#fdf3f3" stroke="#c97070" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="580" y="651" text-anchor="middle" font-size="10" font-style="italic" fill="#7a3a3a">alt [архівування з причиною]: замість PATCH .../complete → POST /api/waybills/&#123;id&#125;/archive з body {reason_code, reason_note};</text>
  <text x="580" y="666" text-anchor="middle" font-size="10" font-style="italic" fill="#7a3a3a">Controller встановлює status="completed", deleted_at=now(), deletion_reason_code=...;</text>
  <text x="580" y="681" text-anchor="middle" font-size="10" font-style="italic" fill="#7a3a3a">isValidArchiveReason(code) перевіряється проти constants/archiveReasons.js (одна з 5 фіксованих причин).</text>
</svg>
