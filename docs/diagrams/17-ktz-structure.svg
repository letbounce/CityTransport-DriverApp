<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2c3958"/>
    </marker>
  </defs>

  <text x="640" y="22" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 3.5. Структура комплексу технічних засобів (КТЗ) інформаційної підсистеми «Мобільний термінал водія»</text>

  <!-- ============== TIER 1: Сервери (центр) ============== -->
  <rect x="430" y="60" width="420" height="400" fill="none" stroke="#5a6b8a" stroke-width="1.6"/>
  <rect x="430" y="60" width="420" height="32" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.6"/>
  <text x="640" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">Серверна інфраструктура (хостинг / private cloud)</text>

  <!-- Application server -->
  <g transform="translate(450,102)">
    <rect width="380" height="100" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="190" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Application Server (Node.js API)</text>
    <line x1="10" y1="28" x2="370" y2="28" stroke="#5a6b8a" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="45" font-size="11" fill="#2c3958">CPU: 4 vCPU (Intel Xeon / AMD EPYC, 2.4+ ГГц)</text>
    <text x="10" y="62" font-size="11" fill="#2c3958">RAM: 8 GB DDR4 ECC</text>
    <text x="10" y="79" font-size="11" fill="#2c3958">SSD: 100 GB NVMe</text>
    <text x="10" y="95" font-size="11" font-style="italic" fill="#5a6b8a">ОС: Ubuntu 22.04 LTS · Node.js 18 LTS · PM2</text>
  </g>

  <!-- Database server -->
  <g transform="translate(450,212)">
    <rect width="380" height="100" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="190" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Database Server (MongoDB)</text>
    <line x1="10" y1="28" x2="370" y2="28" stroke="#5a6b8a" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="45" font-size="11" fill="#2c3958">CPU: 4 vCPU (того ж класу)</text>
    <text x="10" y="62" font-size="11" fill="#2c3958">RAM: 16 GB DDR4 ECC (WiredTiger cache)</text>
    <text x="10" y="79" font-size="11" fill="#2c3958">SSD: 250 GB NVMe (RAID 1) + 500 GB HDD для бекапів</text>
    <text x="10" y="95" font-size="11" font-style="italic" fill="#5a6b8a">MongoDB 6.x · WiredTiger · mongodump cron</text>
  </g>

  <!-- File storage / backup -->
  <g transform="translate(450,322)">
    <rect width="184" height="124" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="92" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">File storage</text>
    <line x1="10" y1="28" x2="174" y2="28" stroke="#5a6b8a" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="45" font-size="11" fill="#2c3958">/server/uploads/</text>
    <text x="10" y="62" font-size="11" fill="#2c3958">фото інцидентів</text>
    <text x="10" y="79" font-size="11" fill="#2c3958">(JPEG, &lt;500 KB)</text>
    <text x="10" y="98" font-size="11" font-style="italic" fill="#5a6b8a">~5 GB / рік</text>
    <text x="10" y="114" font-size="11" font-style="italic" fill="#5a6b8a">на 150 водіїв</text>
  </g>

  <g transform="translate(646,322)">
    <rect width="184" height="124" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="92" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Backup NAS</text>
    <line x1="10" y1="28" x2="174" y2="28" stroke="#5a6b8a" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="45" font-size="11" fill="#2c3958">2 × 2 TB HDD</text>
    <text x="10" y="62" font-size="11" fill="#2c3958">RAID 1 (mirror)</text>
    <text x="10" y="79" font-size="11" fill="#2c3958">mongodump щодоби</text>
    <text x="10" y="98" font-size="11" font-style="italic" fill="#5a6b8a">+ архів /uploads</text>
    <text x="10" y="114" font-size="11" font-style="italic" fill="#5a6b8a">офлайн-холодний бекап</text>
  </g>

  <!-- ============== TIER 2: АРМ диспетчерів (зліва) ============== -->
  <rect x="20" y="60" width="380" height="540" fill="none" stroke="#b89a5c" stroke-width="1.6"/>
  <rect x="20" y="60" width="380" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.6"/>
  <text x="210" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">АРМ диспетчерського персоналу</text>

  <g transform="translate(40,102)">
    <rect width="340" height="100" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="170" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Робоча станція (типова конфігурація)</text>
    <line x1="10" y1="28" x2="330" y2="28" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="45" font-size="11" fill="#2c3958">CPU: Intel Core i5 11-го пок. (4 ядра)</text>
    <text x="10" y="62" font-size="11" fill="#2c3958">RAM: 16 GB DDR4 · SSD: 256 GB</text>
    <text x="10" y="79" font-size="11" fill="#2c3958">Дисплей: 24″ FullHD 1920×1080</text>
    <text x="10" y="95" font-size="11" font-style="italic" fill="#5a6b8a">ОС: Windows 11 / Ubuntu Desktop</text>
  </g>

  <g transform="translate(40,212)">
    <rect width="340" height="76" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="170" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Кількість АРМ (за ролями)</text>
    <line x1="10" y1="28" x2="330" y2="28" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="46" font-size="11" fill="#2c3958">— Старший диспетчер зміни: 1 АРМ × 2 зміни</text>
    <text x="10" y="62" font-size="11" fill="#2c3958">— Диспетчер-маршрутник, з безпеки руху, аналітик: 4 АРМ</text>
  </g>

  <g transform="translate(40,298)">
    <rect width="340" height="90" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="170" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Великий моніторинг-дисплей</text>
    <line x1="10" y1="28" x2="330" y2="28" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="45" font-size="11" fill="#2c3958">55″ 4K (для live-карти всіх рейсів)</text>
    <text x="10" y="62" font-size="11" fill="#2c3958">Підключено до серверного браузера (Chrome)</text>
    <text x="10" y="79" font-size="11" font-style="italic" fill="#5a6b8a">Кількість: 1-2 шт. у диспетчерській залі</text>
  </g>

  <g transform="translate(40,398)">
    <rect width="340" height="80" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="170" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Принтер (PDF-звіти)</text>
    <line x1="10" y1="28" x2="330" y2="28" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="45" font-size="11" fill="#2c3958">Лазерний А4 (~30 стор/хв)</text>
    <text x="10" y="62" font-size="11" fill="#2c3958">Підключення: LAN (Ethernet / SMB)</text>
    <text x="10" y="79" font-size="11" font-style="italic" fill="#5a6b8a">для друку звітів за зміну, інцидентів</text>
  </g>

  <g transform="translate(40,488)">
    <rect width="340" height="90" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="170" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Периферія</text>
    <line x1="10" y1="28" x2="330" y2="28" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="45" font-size="11" fill="#2c3958">Гарнітура (call-сповіщення водіям)</text>
    <text x="10" y="62" font-size="11" fill="#2c3958">UPS на робочому місці (~600 ВА)</text>
    <text x="10" y="79" font-size="11" fill="#2c3958">Сканер штрих-кодів (опц., для документів)</text>
  </g>

  <!-- ============== TIER 3: Мобільні термінали водіїв (справа) ============== -->
  <rect x="880" y="60" width="380" height="540" fill="none" stroke="#b89a5c" stroke-width="1.6"/>
  <rect x="880" y="60" width="380" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.6"/>
  <text x="1070" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">Мобільні термінали водіїв</text>

  <g transform="translate(900,102)">
    <rect width="340" height="130" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="170" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Смартфон / планшет водія (мін. вимоги)</text>
    <line x1="10" y1="28" x2="330" y2="28" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="45" font-size="11" fill="#2c3958">ОС: Android 7.0+ (API 24)</text>
    <text x="10" y="62" font-size="11" fill="#2c3958">CPU: 4 ядра (Snapdragon 4xx+ / Exynos)</text>
    <text x="10" y="79" font-size="11" fill="#2c3958">RAM: 2 GB+ · ROM: 16 GB+ (вільно ≥ 500 MB)</text>
    <text x="10" y="96" font-size="11" fill="#2c3958">Дисплей: 5″+ HD (720×1280) · ≥ 60 Hz</text>
    <text x="10" y="113" font-size="11" font-style="italic" fill="#5a6b8a">target: будь-який бюджетний Android 7-14</text>
  </g>

  <g transform="translate(900,242)">
    <rect width="340" height="100" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="170" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Вбудовані модулі (обов'язкові)</text>
    <line x1="10" y1="28" x2="330" y2="28" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="45" font-size="11" fill="#2c3958">GPS-приймач (L1, точність 3-5 м)</text>
    <text x="10" y="62" font-size="11" fill="#2c3958">Камера (≥ 5 МП, фокус auto)</text>
    <text x="10" y="79" font-size="11" fill="#2c3958">WiFi 802.11 b/g/n + LTE/4G модем</text>
    <text x="10" y="95" font-size="11" font-style="italic" fill="#5a6b8a">+ accelerometer, gyro (опц.)</text>
  </g>

  <g transform="translate(900,352)">
    <rect width="340" height="76" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="170" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Загальна кількість</text>
    <line x1="10" y1="28" x2="330" y2="28" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="46" font-size="11" fill="#2c3958">~150 пристроїв (= кількість водіїв АТП)</text>
    <text x="10" y="62" font-size="11" font-style="italic" fill="#5a6b8a">+ 10-15 резервних (на випадок ремонту)</text>
  </g>

  <g transform="translate(900,438)">
    <rect width="340" height="90" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="170" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Аксесуари (у кабіні ТЗ)</text>
    <line x1="10" y1="28" x2="330" y2="28" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="45" font-size="11" fill="#2c3958">Утримувач смартфона на лобовому склі</text>
    <text x="10" y="62" font-size="11" fill="#2c3958">Зарядний пристрій 12V → USB (2 А)</text>
    <text x="10" y="79" font-size="11" fill="#2c3958">Кабель USB-A / Type-C (1 м)</text>
  </g>

  <g transform="translate(900,538)">
    <rect width="340" height="56" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="170" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">MDM (опційно)</text>
    <line x1="10" y1="26" x2="330" y2="26" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="10" y="44" font-size="11" fill="#2c3958">Mobile Device Management (Hexnode / Scalefusion)</text>
  </g>

  <!-- ============== Network infrastructure (bottom-center) ============== -->
  <rect x="430" y="468" width="420" height="190" fill="none" stroke="#7a9a7a" stroke-width="1.6"/>
  <rect x="430" y="468" width="420" height="30" fill="#f0f6ec" stroke="#7a9a7a" stroke-width="1.6"/>
  <text x="640" y="488" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Мережеве обладнання серверного вузла</text>

  <g transform="translate(450,508)">
    <rect width="184" height="50" fill="white" stroke="#7a9a7a" stroke-width="1.2"/>
    <text x="92" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Інтернет-канал</text>
    <text x="92" y="34" text-anchor="middle" font-size="10" fill="#2c3958">100 Mbps · статичний IPv4</text>
    <text x="92" y="46" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">оптоволокно (FTTH)</text>
  </g>

  <g transform="translate(646,508)">
    <rect width="184" height="50" fill="white" stroke="#7a9a7a" stroke-width="1.2"/>
    <text x="92" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Firewall / VPN gateway</text>
    <text x="92" y="34" text-anchor="middle" font-size="10" fill="#2c3958">pfSense / OPNsense</text>
    <text x="92" y="46" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">TLS-термінація · NAT · IDS</text>
  </g>

  <g transform="translate(450,568)">
    <rect width="184" height="50" fill="white" stroke="#7a9a7a" stroke-width="1.2"/>
    <text x="92" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">LAN-switch L2</text>
    <text x="92" y="34" text-anchor="middle" font-size="10" fill="#2c3958">24-портовий, 1 Gbps</text>
    <text x="92" y="46" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">керований (VLAN, QoS)</text>
  </g>

  <g transform="translate(646,568)">
    <rect width="184" height="50" fill="white" stroke="#7a9a7a" stroke-width="1.2"/>
    <text x="92" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">WiFi 6 AP (у депо)</text>
    <text x="92" y="34" text-anchor="middle" font-size="10" fill="#2c3958">2.4 + 5 GHz</text>
    <text x="92" y="46" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">для синхронізації водіїв у депо</text>
  </g>

  <text x="640" y="640" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">Деталізовану схему мережі див. рис. 3.7</text>

  <!-- ============== Power / cooling (bottom) ============== -->
  <rect x="20" y="620" width="380" height="100" fill="none" stroke="#c97070" stroke-width="1.4"/>
  <rect x="20" y="620" width="380" height="28" fill="#fdf3f3" stroke="#c97070" stroke-width="1.4"/>
  <text x="210" y="639" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a3a3a">Інженерне забезпечення</text>
  <text x="30" y="664" font-size="11" fill="#2c3958">— UPS APC Smart-UPS 3000 ВА (для серверного вузла)</text>
  <text x="30" y="680" font-size="11" fill="#2c3958">— UPS 600-1000 ВА на кожне АРМ диспетчера</text>
  <text x="30" y="696" font-size="11" fill="#2c3958">— Резервний дизель-генератор АТП (60 кВт, автозапуск)</text>
  <text x="30" y="712" font-size="11" fill="#2c3958">— Система кондиціонування серверної (24°C ± 2)</text>

  <!-- ============== Connections ============== -->
  <line x1="400" y1="340" x2="430" y2="340" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="395" y="332" text-anchor="end" font-size="10" font-style="italic" fill="#5a6b8a">LAN (Ethernet 1 Gbps)</text>

  <line x1="880" y1="340" x2="850" y2="340" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="884" y="332" font-size="10" font-style="italic" fill="#5a6b8a">Internet (4G/5G/WiFi)</text>

  <line x1="640" y1="468" x2="640" y2="448" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ============== Bottom summary ============== -->
  <rect x="430" y="680" width="830" height="60" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="440" y="700" font-size="11" font-weight="bold" font-style="italic" fill="#5a4a2a">Підсумкова специфікація КТЗ для АТП на 150 водіїв та диспетчерську зміну з 5-6 співробітників:</text>
  <text x="440" y="718" font-size="10" font-style="italic" fill="#5a4a2a">2 сервери (Application + Database) + Backup NAS · 5-6 АРМ диспетчерів · 1-2 моніторинг-дисплеї · 1 принтер · ~165 смартфонів (з резервом)</text>
  <text x="440" y="734" font-size="10" font-style="italic" fill="#5a4a2a">+ мережеве обладнання (firewall, switch, WiFi AP) · 5-6 UPS · резервне живлення (дизель-генератор)</text>

  <!-- Side legend -->
  <rect x="20" y="755" width="1240" height="105" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="30" y="772" font-size="11" font-weight="bold" font-style="italic" fill="#5a4a2a">Позначення / класифікація вузлів:</text>
  <rect x="30" y="780" width="22" height="14" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="60" y="792" font-size="11" fill="#5a4a2a">— серверне обладнення (центр обробки даних)</text>
  <rect x="430" y="780" width="22" height="14" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="460" y="792" font-size="11" fill="#5a4a2a">— АРМ / мобільні термінали кінцевих користувачів</text>
  <rect x="820" y="780" width="22" height="14" fill="white" stroke="#7a9a7a" stroke-width="1.4"/>
  <text x="850" y="792" font-size="11" fill="#5a4a2a">— мережеве обладнання</text>
  <rect x="30" y="804" width="22" height="14" fill="#fdf3f3" stroke="#c97070" stroke-width="1.4"/>
  <text x="60" y="816" font-size="11" fill="#5a4a2a">— інженерна інфраструктура (живлення, кондиціонування)</text>
  <text x="30" y="838" font-size="10" font-style="italic" fill="#5a4a2a">КТЗ узгоджено зі схемою автоматизації (рис. 3.4) і деталізується в окремих схемах АРМ водія (рис. 3.6) та мережі передачі даних (рис. 3.7).</text>
</svg>
