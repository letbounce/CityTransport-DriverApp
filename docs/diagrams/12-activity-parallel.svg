<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1020" viewBox="0 0 1280 1020"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2c3958"/>
    </marker>
  </defs>

  <text x="640" y="24" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 2.10. Діаграма діяльності (Activity) — паралельні процеси під час виконання активного дорожнього листа</text>

  <!-- ============ START ============ -->
  <circle cx="640" cy="65" r="11" fill="#2c3958"/>
  <line x1="640" y1="76" x2="640" y2="106" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Initial action -->
  <rect x="475" y="110" width="330" height="44" rx="22" ry="22" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="640" y="136" text-anchor="middle" font-size="12" fill="#2c3958">Активний дорожній лист створено (status = in_progress)</text>

  <line x1="640" y1="154" x2="640" y2="186" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- FORK BAR -->
  <rect x="120" y="194" width="1040" height="7" fill="#2c3958"/>
  <text x="130" y="190" font-size="10" font-style="italic" fill="#5a6b8a">fork</text>

  <!-- Connectors from fork to 3 lanes -->
  <line x1="220" y1="201" x2="220" y2="230" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="640" y1="201" x2="640" y2="230" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="1060" y1="201" x2="1060" y2="230" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- =============================================================== -->
  <!-- LANE A — Location capture (LocationTrackingService)             -->
  <!-- =============================================================== -->
  <rect x="80" y="216" width="280" height="350" fill="none" stroke="#7a8aac" stroke-width="1.2"/>
  <rect x="80" y="216" width="78" height="20" fill="#dfeaf7" stroke="#7a8aac" stroke-width="1.2"/>
  <text x="88" y="231" font-size="11" font-weight="bold" fill="#2c3958">loop A</text>
  <text x="166" y="231" font-size="10" font-style="italic" fill="#4a5b7a">[поки status = in_progress]</text>
  <text x="220" y="262" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">LocationTrackingService · FGS</text>

  <rect x="115" y="275" width="210" height="44" rx="22" ry="22" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="220" y="295" text-anchor="middle" font-size="11" fill="#2c3958">Захопити GPS-точку</text>
  <text x="220" y="310" text-anchor="middle" font-size="11" fill="#2c3958">(lat, lng, speed, ts)</text>

  <line x1="220" y1="319" x2="220" y2="360" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="228" y="345" font-size="10" font-style="italic" fill="#5a6b8a">кожні 5 с</text>

  <rect x="115" y="360" width="210" height="44" rx="22" ry="22" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="220" y="380" text-anchor="middle" font-size="11" fill="#2c3958">Зберегти запис у</text>
  <text x="220" y="395" text-anchor="middle" font-size="11" fill="#2c3958">LocalQueue (Room)</text>

  <line x1="220" y1="404" x2="220" y2="440" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Decision A -->
  <path d="M220,440 L295,490 L220,540 L145,490 Z" fill="#fffce8" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="220" y="485" text-anchor="middle" font-size="11" fill="#2c3958">Рейс</text>
  <text x="220" y="500" text-anchor="middle" font-size="11" fill="#2c3958">активний?</text>

  <!-- yes → loop back -->
  <line x1="145" y1="490" x2="90" y2="490" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="90" y1="490" x2="90" y2="297" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="90" y1="297" x2="115" y2="297" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="100" y="485" font-size="10" font-style="italic" fill="#5a6b8a">[так]</text>

  <!-- no → exit -->
  <line x1="220" y1="540" x2="220" y2="775" stroke="#2c3958" stroke-width="1.4"/>
  <text x="230" y="555" font-size="10" font-style="italic" fill="#5a6b8a">[ні] завершити потік</text>

  <!-- =============================================================== -->
  <!-- LANE B — Telemetry sync (TelemetrySyncWorker / WorkManager)    -->
  <!-- =============================================================== -->
  <rect x="450" y="216" width="380" height="490" fill="none" stroke="#7a8aac" stroke-width="1.2"/>
  <rect x="450" y="216" width="78" height="20" fill="#dfeaf7" stroke="#7a8aac" stroke-width="1.2"/>
  <text x="458" y="231" font-size="11" font-weight="bold" fill="#2c3958">loop B</text>
  <text x="536" y="231" font-size="10" font-style="italic" fill="#4a5b7a">[поки status = in_progress]</text>
  <text x="640" y="262" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">TelemetrySyncWorker · PeriodicWorkRequest 15 хв</text>

  <rect x="500" y="275" width="280" height="40" rx="22" ry="22" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="640" y="299" text-anchor="middle" font-size="11" fill="#2c3958">Очікувати тригер WorkManager (15 хв)</text>

  <line x1="640" y1="315" x2="640" y2="345" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="500" y="345" width="280" height="40" rx="22" ry="22" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="640" y="370" text-anchor="middle" font-size="11" fill="#2c3958">Зчитати pending-батч з LocalQueue</text>

  <line x1="640" y1="385" x2="640" y2="410" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Decision B1: network -->
  <path d="M640,410 L735,455 L640,500 L545,455 Z" fill="#fffce8" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="640" y="450" text-anchor="middle" font-size="11" fill="#2c3958">Мережа</text>
  <text x="640" y="465" text-anchor="middle" font-size="11" fill="#2c3958">доступна?</text>

  <!-- yes path -->
  <line x1="640" y1="500" x2="640" y2="528" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="648" y="520" font-size="10" font-style="italic" fill="#5a6b8a">[так]</text>

  <!-- no path: backoff retry -->
  <line x1="735" y1="455" x2="805" y2="455" stroke="#2c3958" stroke-width="1.4"/>
  <text x="743" y="448" font-size="10" font-style="italic" fill="#5a6b8a">[ні]</text>
  <line x1="805" y1="455" x2="805" y2="295" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="805" y1="295" x2="780" y2="295" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="745" y="380" width="78" height="32" fill="#fdf3f3" stroke="#c97070" stroke-width="1"/>
  <text x="784" y="395" text-anchor="middle" font-size="9" fill="#7a3a3a">retry()</text>
  <text x="784" y="406" text-anchor="middle" font-size="9" fill="#7a3a3a">backoff</text>

  <rect x="500" y="528" width="280" height="40" rx="22" ry="22" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="640" y="552" text-anchor="middle" font-size="11" fill="#2c3958">POST /api/telemetry (HTTPS + JWT)</text>

  <line x1="640" y1="568" x2="640" y2="595" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="500" y="595" width="280" height="40" rx="22" ry="22" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="640" y="619" text-anchor="middle" font-size="11" fill="#2c3958">Видалити синхронізовані рядки</text>

  <!-- loop back B -->
  <line x1="500" y1="615" x2="475" y2="615" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="475" y1="615" x2="475" y2="295" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="475" y1="295" x2="500" y2="295" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="430" y="455" font-size="10" font-style="italic" fill="#5a6b8a">наступний батч</text>

  <!-- exit lane B -->
  <line x1="640" y1="635" x2="640" y2="775" stroke="#2c3958" stroke-width="1.4"/>
  <text x="650" y="660" font-size="10" font-style="italic" fill="#5a6b8a">завершити потік</text>
  <text x="650" y="672" font-size="10" font-style="italic" fill="#5a6b8a">після зміни статусу</text>

  <!-- =============================================================== -->
  <!-- LANE C — UI водія (ActiveTripScreen)                            -->
  <!-- =============================================================== -->
  <rect x="900" y="216" width="320" height="550" fill="none" stroke="#7a8aac" stroke-width="1.2"/>
  <rect x="900" y="216" width="78" height="20" fill="#dfeaf7" stroke="#7a8aac" stroke-width="1.2"/>
  <text x="908" y="231" font-size="11" font-weight="bold" fill="#2c3958">loop C</text>
  <text x="986" y="231" font-size="10" font-style="italic" fill="#4a5b7a">[поки status = in_progress]</text>
  <text x="1060" y="262" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">UI thread · ActiveTripScreen</text>

  <rect x="945" y="275" width="230" height="44" rx="22" ry="22" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="1060" y="295" text-anchor="middle" font-size="11" fill="#2c3958">Слухати дії водія</text>
  <text x="1060" y="310" text-anchor="middle" font-size="11" fill="#2c3958">(UI ActiveTripScreen)</text>

  <line x1="1060" y1="319" x2="1060" y2="345" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Decision C: action -->
  <path d="M1060,345 L1165,395 L1060,445 L955,395 Z" fill="#fffce8" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="1060" y="390" text-anchor="middle" font-size="11" fill="#2c3958">Дія водія?</text>

  <!-- left branch: Incident -->
  <line x1="955" y1="395" x2="920" y2="395" stroke="#2c3958" stroke-width="1.4"/>
  <text x="920" y="385" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">[Інцидент]</text>
  <line x1="920" y1="395" x2="920" y2="475" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="920" y1="475" x2="945" y2="475" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="945" y="475" width="230" height="44" rx="22" ry="22" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="1060" y="495" text-anchor="middle" font-size="11" fill="#2c3958">Відкрити IncidentReportScreen</text>
  <text x="1060" y="510" text-anchor="middle" font-size="11" fill="#2c3958">+ POST /api/incidents</text>

  <!-- loop back from incident to listen -->
  <line x1="1175" y1="497" x2="1205" y2="497" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="1205" y1="497" x2="1205" y2="297" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="1205" y1="297" x2="1175" y2="297" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- right branch: Finish -->
  <line x1="1165" y1="395" x2="1185" y2="395" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="1185" y1="395" x2="1185" y2="555" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="1198" y="430" font-size="10" font-style="italic" fill="#5a6b8a">[Завершити]</text>

  <!-- Decision C2: confirm -->
  <path d="M1185,555 L1245,595 L1185,635 L1125,595 Z" fill="#fffce8" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="1185" y="590" text-anchor="middle" font-size="11" fill="#2c3958">Підтверд</text>
  <text x="1185" y="604" text-anchor="middle" font-size="11" fill="#2c3958">ити?</text>

  <!-- no → loop back до Listen (обхід знизу алмаза, потім назовні lane праворуч, вгору і ліворуч до правого краю Listen-блоку) -->
  <line x1="1125" y1="595" x2="1100" y2="595" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="1100" y1="595" x2="1100" y2="720" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="1100" y1="720" x2="1255" y2="720" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="1255" y1="720" x2="1255" y2="285" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="1255" y1="285" x2="1175" y2="285" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="1075" y="588" font-size="10" font-style="italic" fill="#5a6b8a">[ні]</text>

  <!-- yes → exit lane C to join bar -->
  <line x1="1185" y1="635" x2="1185" y2="700" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="1185" y1="700" x2="1060" y2="700" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="1060" y1="700" x2="1060" y2="775" stroke="#2c3958" stroke-width="1.4"/>
  <text x="1195" y="660" font-size="10" font-style="italic" fill="#5a6b8a">[так]</text>

  <!-- =============================================================== -->
  <!-- JOIN BAR -->
  <!-- =============================================================== -->
  <rect x="120" y="780" width="1040" height="7" fill="#2c3958"/>
  <text x="130" y="775" font-size="10" font-style="italic" fill="#5a6b8a">join</text>

  <!-- Bottom actions -->
  <line x1="640" y1="787" x2="640" y2="815" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="475" y="815" width="330" height="40" rx="20" ry="20" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="640" y="839" text-anchor="middle" font-size="12" fill="#2c3958">PATCH /api/waybills/&#123;id&#125;/complete</text>

  <line x1="640" y1="855" x2="640" y2="880" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="475" y="880" width="330" height="40" rx="20" ry="20" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="640" y="904" text-anchor="middle" font-size="12" fill="#2c3958">Зупинити LocationTrackingService</text>

  <!-- End node -->
  <line x1="640" y1="920" x2="640" y2="950" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <circle cx="640" cy="965" r="13" fill="none" stroke="#2c3958" stroke-width="1.6"/>
  <circle cx="640" cy="965" r="7" fill="#2c3958"/>
</svg>
