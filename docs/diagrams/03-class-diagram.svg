<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="open-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,1 L10,6 L0,11" fill="none" stroke="#3a3a3a" stroke-width="1.4"/>
    </marker>
    <marker id="diamond" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="16" markerHeight="10" orient="auto">
      <path d="M0,5 L8,1 L16,5 L8,9 Z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <text x="600" y="24" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 2.4. Діаграма класів інформаційної підсистеми «Мобільний термінал водія» (RoutePulse)</text>

  <!-- ================== DATA TIER FRAME ================== -->
  <rect x="10" y="40" width="520" height="860" fill="none" stroke="#b89a5c" stroke-width="1.6"/>
  <text x="270" y="62" text-anchor="middle" font-size="13" font-style="italic" fill="#7a6a4a">«Data Tier»</text>

  <!-- Driver class (top center) -->
  <g transform="translate(190,90)">
    <rect x="0" y="0" width="170" height="110" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <rect x="1" y="1" width="168" height="22" fill="#f5e8c8" stroke="none"/>
    <line x1="0" y1="22" x2="170" y2="22" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="85" y="17" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a3a3a">Driver</text>
    <text x="10" y="40" font-size="11" fill="#3a3a3a">- driverId: String</text>
    <text x="10" y="55" font-size="11" fill="#3a3a3a">- fullName: String</text>
    <text x="10" y="70" font-size="11" fill="#3a3a3a">- token: String</text>
    <line x1="0" y1="80" x2="170" y2="80" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="10" y="95" font-size="11" fill="#3a3a3a">+ login(): AuthSession</text>
  </g>

  <!-- Route class (mid-left) -->
  <g transform="translate(15,290)">
    <rect x="0" y="0" width="155" height="190" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <rect x="1" y="1" width="153" height="22" fill="#f5e8c8" stroke="none"/>
    <line x1="0" y1="22" x2="155" y2="22" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="77" y="17" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a3a3a">Route</text>
    <text x="8" y="40" font-size="11" fill="#3a3a3a">- id: String</text>
    <text x="8" y="55" font-size="11" fill="#3a3a3a">- routeNumber: String</text>
    <text x="8" y="70" font-size="11" fill="#3a3a3a">- routeName: String</text>
    <text x="8" y="85" font-size="11" fill="#3a3a3a">- geoJsonPath: String</text>
    <line x1="0" y1="100" x2="155" y2="100" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="8" y="118" font-size="11" fill="#3a3a3a">+ getStops(): List</text>
    <text x="8" y="135" font-size="11" fill="#3a3a3a">+ getGeoJson(): String</text>
  </g>

  <!-- Waybill class (center) -->
  <g transform="translate(190,290)">
    <rect x="0" y="0" width="200" height="220" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <rect x="1" y="1" width="198" height="22" fill="#f5e8c8" stroke="none"/>
    <line x1="0" y1="22" x2="200" y2="22" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="100" y="17" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a3a3a">Waybill</text>
    <text x="10" y="40" font-size="11" fill="#3a3a3a">- id: String</text>
    <text x="10" y="55" font-size="11" fill="#3a3a3a">- driverId: String</text>
    <text x="10" y="70" font-size="11" fill="#3a3a3a">- routeId: String</text>
    <text x="10" y="85" font-size="11" fill="#3a3a3a">- vehicleId: String</text>
    <text x="10" y="100" font-size="11" fill="#3a3a3a">- status: String</text>
    <text x="10" y="115" font-size="11" fill="#3a3a3a">- startedAt: Date</text>
    <text x="10" y="130" font-size="11" fill="#3a3a3a">- completedAt: Date</text>
    <line x1="0" y1="140" x2="200" y2="140" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="10" y="158" font-size="11" fill="#3a3a3a">+ start(): void</text>
    <text x="10" y="175" font-size="11" fill="#3a3a3a">+ complete(): void</text>
    <text x="10" y="192" font-size="11" fill="#3a3a3a">+ archive(reason): void</text>
  </g>

  <!-- Stop class (bottom-left) -->
  <g transform="translate(15,610)">
    <rect x="0" y="0" width="155" height="160" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <rect x="1" y="1" width="153" height="22" fill="#f5e8c8" stroke="none"/>
    <line x1="0" y1="22" x2="155" y2="22" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="77" y="17" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a3a3a">Stop</text>
    <text x="8" y="40" font-size="11" fill="#3a3a3a">- stopNumber: Int</text>
    <text x="8" y="55" font-size="11" fill="#3a3a3a">- name: String</text>
    <text x="8" y="70" font-size="11" fill="#3a3a3a">- plannedTime: String</text>
    <text x="8" y="85" font-size="11" fill="#3a3a3a">- lat: Double</text>
    <text x="8" y="100" font-size="11" fill="#3a3a3a">- lng: Double</text>
  </g>

  <!-- IncidentItem class (bottom-center) -->
  <g transform="translate(190,610)">
    <rect x="0" y="0" width="200" height="200" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <rect x="1" y="1" width="198" height="22" fill="#f5e8c8" stroke="none"/>
    <line x1="0" y1="22" x2="200" y2="22" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="100" y="17" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a3a3a">IncidentItem</text>
    <text x="10" y="40" font-size="11" fill="#3a3a3a">- id: String</text>
    <text x="10" y="55" font-size="11" fill="#3a3a3a">- waybillId: String</text>
    <text x="10" y="70" font-size="11" fill="#3a3a3a">- type: String</text>
    <text x="10" y="85" font-size="11" fill="#3a3a3a">- description: String</text>
    <text x="10" y="100" font-size="11" fill="#3a3a3a">- status: String</text>
    <text x="10" y="115" font-size="11" fill="#3a3a3a">- lat / lng: Double</text>
    <text x="10" y="130" font-size="11" fill="#3a3a3a">- photoUrl: String</text>
    <line x1="0" y1="140" x2="200" y2="140" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="10" y="158" font-size="11" fill="#3a3a3a">+ report(): void</text>
    <text x="10" y="175" font-size="11" fill="#3a3a3a">+ update(): void</text>
    <text x="10" y="192" font-size="11" fill="#3a3a3a">+ archive(reason): void</text>
  </g>

  <!-- ============ Compositions inside Data Tier ============ -->
  <!-- 1. Driver (1) - Waybill (0..*) -->
  <line x1="275" y1="200" x2="275" y2="290" stroke="#3a3a3a" stroke-width="1.4" marker-start="url(#diamond)"/>
  <text x="280" y="220" font-size="11" fill="#3a3a3a">1</text>
  <text x="280" y="285" font-size="11" fill="#3a3a3a">0..*</text>

  <!-- 2. Route (1) - Waybill (0..*)  horizontal -->
  <line x1="170" y1="400" x2="190" y2="400" stroke="#3a3a3a" stroke-width="1.4" marker-start="url(#diamond)"/>
  <text x="172" y="395" font-size="11" fill="#3a3a3a">1</text>
  <text x="174" y="412" font-size="11" fill="#3a3a3a">0..*</text>

  <!-- 3. Waybill (1) - IncidentItem (0..*) -->
  <line x1="290" y1="510" x2="290" y2="610" stroke="#3a3a3a" stroke-width="1.4" marker-start="url(#diamond)"/>
  <text x="296" y="528" font-size="11" fill="#3a3a3a">1</text>
  <text x="296" y="605" font-size="11" fill="#3a3a3a">0..*</text>

  <!-- 4. Route (1) - Stop (0..*) -->
  <line x1="90" y1="480" x2="90" y2="610" stroke="#3a3a3a" stroke-width="1.4" marker-start="url(#diamond)"/>
  <text x="96" y="498" font-size="11" fill="#3a3a3a">1</text>
  <text x="96" y="605" font-size="11" fill="#3a3a3a">0..*</text>

  <!-- ================== APPLICATION SERVER TIER FRAME ================== -->
  <rect x="560" y="40" width="200" height="860" fill="none" stroke="#b89a5c" stroke-width="1.6"/>
  <text x="660" y="62" text-anchor="middle" font-size="13" font-style="italic" fill="#7a6a4a">«Application Server Tier»</text>

  <!-- Controllers (circles + name below) -->
  <g>
    <circle cx="660" cy="145" r="38" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <line x1="660" y1="107" x2="660" y2="183" stroke="#b89a5c" stroke-width="1"/>
    <text x="660" y="205" text-anchor="middle" font-size="12" fill="#3a3a3a">AuthController</text>
  </g>
  <g>
    <circle cx="660" cy="300" r="38" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <line x1="660" y1="262" x2="660" y2="338" stroke="#b89a5c" stroke-width="1"/>
    <text x="660" y="360" text-anchor="middle" font-size="12" fill="#3a3a3a">WaybillController</text>
  </g>
  <g>
    <circle cx="660" cy="460" r="38" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <line x1="660" y1="422" x2="660" y2="498" stroke="#b89a5c" stroke-width="1"/>
    <text x="660" y="520" text-anchor="middle" font-size="12" fill="#3a3a3a">TelemetryController</text>
  </g>
  <g>
    <circle cx="660" cy="620" r="38" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <line x1="660" y1="582" x2="660" y2="658" stroke="#b89a5c" stroke-width="1"/>
    <text x="660" y="680" text-anchor="middle" font-size="12" fill="#3a3a3a">IncidentController</text>
  </g>
  <g>
    <circle cx="660" cy="780" r="38" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <line x1="660" y1="742" x2="660" y2="818" stroke="#b89a5c" stroke-width="1"/>
    <text x="660" y="840" text-anchor="middle" font-size="12" fill="#3a3a3a">RouteController</text>
  </g>

  <!-- ================== CLIENT TIER FRAME ================== -->
  <rect x="790" y="40" width="350" height="860" fill="none" stroke="#b89a5c" stroke-width="1.6"/>
  <text x="965" y="62" text-anchor="middle" font-size="13" font-style="italic" fill="#7a6a4a">«Client Tier» (Android · Jetpack Compose)</text>

  <!-- Screens (circles + name below) -->
  <g>
    <circle cx="990" cy="145" r="38" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <line x1="990" y1="107" x2="990" y2="183" stroke="#b89a5c" stroke-width="1"/>
    <text x="990" y="205" text-anchor="middle" font-size="12" fill="#3a3a3a">LoginScreen</text>
  </g>
  <g>
    <circle cx="990" cy="300" r="38" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <line x1="990" y1="262" x2="990" y2="338" stroke="#b89a5c" stroke-width="1"/>
    <text x="990" y="360" text-anchor="middle" font-size="12" fill="#3a3a3a">RouteDashboardScreen</text>
  </g>
  <g>
    <circle cx="990" cy="460" r="38" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <line x1="990" y1="422" x2="990" y2="498" stroke="#b89a5c" stroke-width="1"/>
    <text x="990" y="520" text-anchor="middle" font-size="12" fill="#3a3a3a">ActiveTripScreen</text>
  </g>
  <g>
    <circle cx="990" cy="620" r="38" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <line x1="990" y1="582" x2="990" y2="658" stroke="#b89a5c" stroke-width="1"/>
    <text x="990" y="680" text-anchor="middle" font-size="12" fill="#3a3a3a">IncidentReportScreen</text>
  </g>
  <g>
    <circle cx="990" cy="780" r="38" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
    <line x1="990" y1="742" x2="990" y2="818" stroke="#b89a5c" stroke-width="1"/>
    <text x="990" y="840" text-anchor="middle" font-size="12" fill="#3a3a3a">TripMapScreen</text>
  </g>

  <!-- ============ Dependency arrows: Client -> Controller ============ -->
  <line x1="952" y1="145" x2="700" y2="145" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open-tri)"/>
  <line x1="952" y1="300" x2="700" y2="300" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open-tri)"/>
  <line x1="952" y1="450" x2="700" y2="450" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open-tri)"/>
  <line x1="952" y1="470" x2="700" y2="290" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open-tri)"/>
  <line x1="952" y1="620" x2="700" y2="620" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open-tri)"/>
  <line x1="952" y1="780" x2="700" y2="780" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open-tri)"/>

  <!-- ============ Dependency arrows: Controller -> Data class ============ -->
  <line x1="622" y1="145" x2="365" y2="145" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open-tri)"/>
  <line x1="622" y1="300" x2="395" y2="345" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open-tri)"/>
  <line x1="622" y1="460" x2="395" y2="460" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open-tri)"/>
  <line x1="622" y1="620" x2="395" y2="640" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open-tri)"/>
  <line x1="622" y1="780" x2="170" y2="430" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open-tri)"/>
</svg>
