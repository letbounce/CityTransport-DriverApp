<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="filled-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2c3958"/>
    </marker>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#2c3958" stroke-width="1.4"/>
    </marker>
  </defs>

  <text x="600" y="24" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 2.5. Діаграма послідовності для сценарію «Створення нового дорожнього листа»</text>

  <!-- ========== Participants header ========== -->

  <!-- 1. Водій (actor) -->
  <g transform="translate(80,52)">
    <circle cx="0" cy="0" r="10" fill="#f4e7c8" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="10" x2="0" y2="40" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="-16" y1="22" x2="16" y2="22" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="40" x2="-14" y2="62" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="40" x2="14" y2="62" stroke="#7a6a4a" stroke-width="1.4"/>
    <text x="0" y="82" text-anchor="middle" font-size="13" fill="#2c3958">:Водій</text>
  </g>

  <!-- 2. Screen -->
  <rect x="172" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="240" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:RouteDashboardScreen</text>

  <!-- 3. ViewModel -->
  <rect x="332" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="400" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:DashboardViewModel</text>

  <!-- 4. Repository -->
  <rect x="492" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="560" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:WaybillRepository</text>

  <!-- 5. ApiService -->
  <rect x="652" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="720" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:ApiService (Retrofit)</text>

  <!-- 6. Controller -->
  <rect x="822" y="92" width="136" height="32" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="890" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:WaybillController</text>

  <!-- 7. MongoDB -->
  <rect x="992" y="92" width="136" height="32" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="1060" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:MongoDB</text>

  <!-- Subtle hint that 6-7 are server-side -->
  <line x1="800" y1="40" x2="800" y2="650" stroke="#bcc6da" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="813" y="42" font-size="10" fill="#7a8aac" font-style="italic">Server side</text>

  <!-- ========== Lifelines (vertical dashed) ========== -->
  <line x1="80" y1="124" x2="80" y2="650" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="240" y1="124" x2="240" y2="650" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="400" y1="124" x2="400" y2="650" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="560" y1="124" x2="560" y2="650" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="720" y1="124" x2="720" y2="650" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="890" y1="124" x2="890" y2="650" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1060" y1="124" x2="1060" y2="650" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ========== Activation bars (thin rectangles on lifelines) ========== -->
  <rect x="236" y="170" width="8" height="385" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="396" y="205" width="8" height="315" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="556" y="240" width="8" height="245" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="716" y="275" width="8" height="175" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="886" y="310" width="8" height="105" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="1056" y="345" width="8" height="35" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>

  <!-- ========== Messages (sync = solid + filled arrow; return = dashed + open arrow) ========== -->

  <!-- 1: tap "Отримати дорожній лист" -->
  <line x1="82" y1="170" x2="236" y2="170" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="159" y="164" text-anchor="middle" font-size="11" fill="#2c3958">1: tap "Отримати дорожній лист"</text>

  <!-- 2: onStartTrip(routeId, vehicleId) -->
  <line x1="244" y1="205" x2="396" y2="205" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="320" y="199" text-anchor="middle" font-size="11" fill="#2c3958">2: onStartTrip(routeId, vehicleId)</text>

  <!-- 3: startWaybill(...) -->
  <line x1="404" y1="240" x2="556" y2="240" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="480" y="234" text-anchor="middle" font-size="11" fill="#2c3958">3: startWaybill(routeId, vehicleId)</text>

  <!-- 4: POST /api/waybills -->
  <line x1="564" y1="275" x2="716" y2="275" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="640" y="269" text-anchor="middle" font-size="11" fill="#2c3958">4: POST /api/waybills</text>

  <!-- 5: HTTP POST {JWT, body} -->
  <line x1="724" y1="310" x2="886" y2="310" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="805" y="304" text-anchor="middle" font-size="11" fill="#2c3958">5: HTTPS POST {JWT, body}</text>

  <!-- 6: insertOne(waybill) -->
  <line x1="894" y1="345" x2="1056" y2="345" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="975" y="339" text-anchor="middle" font-size="11" fill="#2c3958">6: insertOne(waybill)</text>

  <!-- 7: {_id, status:"in_progress", ...} (return) -->
  <line x1="1056" y1="380" x2="894" y2="380" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="975" y="374" text-anchor="middle" font-size="11" fill="#4a5b7a">7: {_id, status:"in_progress"}</text>

  <!-- 8: 201 WaybillDto (return) -->
  <line x1="886" y1="415" x2="724" y2="415" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="805" y="409" text-anchor="middle" font-size="11" fill="#4a5b7a">8: 201 Created WaybillDto</text>

  <!-- 9: Waybill (return) -->
  <line x1="716" y1="450" x2="564" y2="450" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="640" y="444" text-anchor="middle" font-size="11" fill="#4a5b7a">9: Waybill (domain model)</text>

  <!-- 10: Result.Success(waybill) (return) -->
  <line x1="556" y1="485" x2="404" y2="485" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="480" y="479" text-anchor="middle" font-size="11" fill="#4a5b7a">10: Result.Success(waybill)</text>

  <!-- 11: state.update(activeWaybill = ...) -->
  <line x1="396" y1="520" x2="244" y2="520" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="320" y="514" text-anchor="middle" font-size="11" fill="#2c3958">11: emit(uiState.copy(active=waybill))</text>

  <!-- 12: navigateTo(ActiveTripScreen) (return to actor) -->
  <line x1="236" y1="555" x2="92" y2="555" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="160" y="549" text-anchor="middle" font-size="11" fill="#4a5b7a">12: navigateTo(ActiveTripScreen)</text>
</svg>
