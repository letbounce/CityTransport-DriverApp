<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2c3958"/>
    </marker>
  </defs>

  <text x="640" y="22" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 3.6. Схема автоматизованого робочого місця (АРМ) водія міського пасажирського транспорту</text>

  <!-- ============== Кабіна ТЗ — велика рамка (зліва + центр) ============== -->
  <rect x="20" y="60" width="880" height="720" fill="none" stroke="#7a8aac" stroke-width="1.6" stroke-dasharray="6,3"/>
  <rect x="20" y="60" width="880" height="30" fill="#eef0f3" stroke="#7a8aac" stroke-width="1.6"/>
  <text x="460" y="80" text-anchor="middle" font-size="13" font-weight="bold" font-style="italic" fill="#2c3958">Кабіна транспортного засобу (контекст експлуатації)</text>

  <!-- ============== Driver actor (внизу зліва) ============== -->
  <g transform="translate(100,620)">
    <circle cx="0" cy="0" r="18" fill="#f4e7c8" stroke="#7a6a4a" stroke-width="1.6"/>
    <line x1="0" y1="18" x2="0" y2="80" stroke="#7a6a4a" stroke-width="1.6"/>
    <line x1="-30" y1="42" x2="30" y2="42" stroke="#7a6a4a" stroke-width="1.6"/>
    <line x1="0" y1="80" x2="-22" y2="120" stroke="#7a6a4a" stroke-width="1.6"/>
    <line x1="0" y1="80" x2="22" y2="120" stroke="#7a6a4a" stroke-width="1.6"/>
    <text x="0" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">Водій</text>
  </g>

  <!-- ============== Cabin accessories — left column ============== -->
  <g transform="translate(40,110)">
    <rect width="240" height="62" fill="white" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="120" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Утримувач смартфона</text>
    <text x="120" y="38" text-anchor="middle" font-size="11" fill="#2c3958">кріплення на лобовому склі</text>
    <text x="120" y="54" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">кут нахилу, поворотний</text>
  </g>

  <g transform="translate(40,190)">
    <rect width="240" height="62" fill="white" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="120" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Зарядка 12V → USB</text>
    <text x="120" y="38" text-anchor="middle" font-size="11" fill="#2c3958">від бортової мережі ТЗ</text>
    <text x="120" y="54" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">2 А, 10 Вт</text>
  </g>

  <g transform="translate(40,270)">
    <rect width="240" height="56" fill="white" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="120" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Кабель USB-A / Type-C</text>
    <text x="120" y="40" text-anchor="middle" font-size="11" fill="#2c3958">1 м, сертифікований</text>
  </g>

  <g transform="translate(40,344)">
    <rect width="240" height="62" fill="white" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="120" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Бортова мережа ТЗ</text>
    <text x="120" y="38" text-anchor="middle" font-size="11" fill="#2c3958">+12V постійний струм</text>
    <text x="120" y="54" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">через прикурювач</text>
  </g>

  <g transform="translate(40,424)">
    <rect width="240" height="62" fill="white" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="120" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Гарнітура (опційно)</text>
    <text x="120" y="38" text-anchor="middle" font-size="11" fill="#2c3958">Bluetooth-навушник</text>
    <text x="120" y="54" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">для голосових сповіщень</text>
  </g>

  <!-- ============== Смартфон — центральний блок ============== -->
  <rect x="320" y="110" width="540" height="650" fill="none" stroke="#b89a5c" stroke-width="2"/>
  <rect x="320" y="110" width="540" height="34" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.6"/>
  <text x="590" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">Смартфон / планшет водія (Android 7.0+, API 24)</text>

  <text x="590" y="166" text-anchor="middle" font-size="11" font-style="italic" fill="#5a6b8a">Snapdragon 4xx+ / Exynos · 2-4 GB RAM · 16+ GB ROM · 5″+ HD-екран</text>

  <!-- Hardware section -->
  <text x="590" y="194" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic" fill="#7a4a2a">— Апаратні модулі —</text>

  <g transform="translate(340,206)">
    <rect width="245" height="50" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="122" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Touchscreen-дисплей</text>
    <text x="122" y="38" text-anchor="middle" font-size="10" fill="#2c3958">5″+ HD 720×1280, capacitive</text>
  </g>

  <g transform="translate(595,206)">
    <rect width="245" height="50" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="122" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">GPS-приймач (L1)</text>
    <text x="122" y="38" text-anchor="middle" font-size="10" fill="#2c3958">точність 3-5 м, оновлення 1 Гц</text>
  </g>

  <g transform="translate(340,264)">
    <rect width="245" height="50" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="122" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Камера (тильна)</text>
    <text x="122" y="38" text-anchor="middle" font-size="10" fill="#2c3958">≥ 5 МП, autofocus, спалах</text>
  </g>

  <g transform="translate(595,264)">
    <rect width="245" height="50" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="122" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Акумулятор</text>
    <text x="122" y="38" text-anchor="middle" font-size="10" fill="#2c3958">Li-Ion 3000+ mAh, 6-10 год роботи</text>
  </g>

  <g transform="translate(340,322)">
    <rect width="245" height="50" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="122" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">CPU + RAM</text>
    <text x="122" y="38" text-anchor="middle" font-size="10" fill="#2c3958">4 ядра 1.5+ ГГц, 2-4 GB RAM</text>
  </g>

  <g transform="translate(595,322)">
    <rect width="245" height="50" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="122" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Внутрішня пам'ять</text>
    <text x="122" y="38" text-anchor="middle" font-size="10" fill="#2c3958">16+ GB ROM (вільно ≥ 500 MB)</text>
  </g>

  <g transform="translate(340,380)">
    <rect width="500" height="50" fill="#fdfaef" stroke="#b89a5c" stroke-width="1.4"/>
    <text x="250" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Модулі бездротового зв'язку</text>
    <text x="250" y="38" text-anchor="middle" font-size="10" fill="#2c3958">WiFi 802.11 b/g/n  ·  LTE / 4G  ·  Bluetooth 4.0+ (для гарнітури)</text>
  </g>

  <!-- Software stack section -->
  <line x1="340" y1="446" x2="840" y2="446" stroke="#b89a5c" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="590" y="464" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic" fill="#7a4a2a">— Програмний стек —</text>

  <g transform="translate(340,476)">
    <rect width="500" height="50" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="250" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">RoutePulse app  (Kotlin / Jetpack Compose)</text>
    <text x="250" y="38" text-anchor="middle" font-size="10" fill="#2c3958">LoginScreen · ActiveTripScreen · IncidentReportScreen · TripMapScreen · ...</text>
  </g>

  <g transform="translate(340,534)">
    <rect width="500" height="46" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="250" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Системні служби RoutePulse</text>
    <text x="250" y="36" text-anchor="middle" font-size="10" fill="#2c3958">LocationTrackingService (FGS) · TelemetrySyncWorker (WorkManager) · FileProvider</text>
  </g>

  <g transform="translate(340,588)">
    <rect width="500" height="46" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="250" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Бібліотеки</text>
    <text x="250" y="36" text-anchor="middle" font-size="10" fill="#2c3958">Retrofit · OkHttp · OSMdroid · Room · DataStore · play-services-location</text>
  </g>

  <g transform="translate(340,642)">
    <rect width="500" height="46" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="250" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Системне ПЗ</text>
    <text x="250" y="36" text-anchor="middle" font-size="10" fill="#2c3958">Android OS 7.0+ (API 24) · Google Play Services · ART runtime</text>
  </g>

  <!-- Locally stored data -->
  <g transform="translate(340,696)">
    <rect width="500" height="46" fill="#f0f6ec" stroke="#7a9a7a" stroke-width="1.4"/>
    <text x="250" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3958">Локальні дані</text>
    <text x="250" y="36" text-anchor="middle" font-size="10" fill="#2c3958">Room LocalQueue · EncryptedSharedPrefs (JWT) · DataStore (session) · cache фото</text>
  </g>

  <!-- ============== External services — right panel ============== -->
  <rect x="920" y="60" width="340" height="720" fill="none" stroke="#7a8aac" stroke-width="1.4" stroke-dasharray="4,3"/>
  <rect x="920" y="60" width="340" height="30" fill="#eef0f3" stroke="#7a8aac" stroke-width="1.4"/>
  <text x="1090" y="80" text-anchor="middle" font-size="13" font-weight="bold" font-style="italic" fill="#2c3958">Зовнішні служби / канали зв'язку</text>

  <g transform="translate(940,110)">
    <rect width="300" height="80" fill="#eef0f3" stroke="#7a8aac" stroke-width="1.4"/>
    <text x="150" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">GPS / Galileo</text>
    <text x="150" y="40" text-anchor="middle" font-size="11" fill="#2c3958">супутникова навігація</text>
    <text x="150" y="56" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">L1/L5 радіосигнал, passive</text>
    <text x="150" y="72" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">→ GPS-приймач смартфона</text>
  </g>

  <g transform="translate(940,210)">
    <rect width="300" height="80" fill="#eef0f3" stroke="#7a8aac" stroke-width="1.4"/>
    <text x="150" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">Базова станція 4G/LTE</text>
    <text x="150" y="40" text-anchor="middle" font-size="11" fill="#2c3958">мобільний оператор (Київстар,</text>
    <text x="150" y="56" text-anchor="middle" font-size="11" fill="#2c3958">Vodafone, lifecell)</text>
    <text x="150" y="72" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">для зв'язку з API-сервером</text>
  </g>

  <g transform="translate(940,310)">
    <rect width="300" height="80" fill="#eef0f3" stroke="#7a8aac" stroke-width="1.4"/>
    <text x="150" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">RoutePulse API server</text>
    <text x="150" y="40" text-anchor="middle" font-size="11" fill="#2c3958">Node.js + MongoDB</text>
    <text x="150" y="56" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">HTTPS · REST · JWT (HS256)</text>
    <text x="150" y="72" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">детально — рис. 3.4 та 3.7</text>
  </g>

  <g transform="translate(940,410)">
    <rect width="300" height="80" fill="#eef0f3" stroke="#7a8aac" stroke-width="1.4"/>
    <text x="150" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">OSM tile-server</text>
    <text x="150" y="40" text-anchor="middle" font-size="11" fill="#2c3958">tile.openstreetmap.org</text>
    <text x="150" y="56" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">растрові тайли (PNG 256×256)</text>
    <text x="150" y="72" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">→ OSMdroid у RoutePulse</text>
  </g>

  <g transform="translate(940,510)">
    <rect width="300" height="100" fill="#eef0f3" stroke="#7a8aac" stroke-width="1.4"/>
    <text x="150" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">WiFi-AP АТП (у депо)</text>
    <text x="150" y="40" text-anchor="middle" font-size="11" fill="#2c3958">WiFi 6 / 5GHz</text>
    <text x="150" y="56" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">альтернатива 4G на території депо:</text>
    <text x="150" y="72" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">— увімкнення зміни</text>
    <text x="150" y="88" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">— синхронізація telemetry-черги</text>
  </g>

  <g transform="translate(940,630)">
    <rect width="300" height="80" fill="#eef0f3" stroke="#7a8aac" stroke-width="1.4" stroke-dasharray="2,2"/>
    <text x="150" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3958">MDM (опційно)</text>
    <text x="150" y="40" text-anchor="middle" font-size="11" fill="#2c3958">Mobile Device Management</text>
    <text x="150" y="56" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">Hexnode · Scalefusion · MS Intune</text>
    <text x="150" y="72" text-anchor="middle" font-size="10" font-style="italic" fill="#5a6b8a">керування політиками безпеки</text>
  </g>

  <!-- ============== Connections ============== -->
  <!-- Cable від зарядки до смартфона (через кабель) -->
  <line x1="280" y1="220" x2="320" y2="280" stroke="#2c3958" stroke-width="1.4"/>
  <line x1="280" y1="298" x2="320" y2="298" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="285" y="270" font-size="10" font-style="italic" fill="#5a6b8a">+5V живлення</text>

  <!-- Гарнітура → Bluetooth (smartphone modules) -->
  <line x1="280" y1="455" x2="320" y2="400" stroke="#2c3958" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="220" y="475" font-size="10" font-style="italic" fill="#5a6b8a">Bluetooth</text>

  <!-- Утримувач → смартфон (механічно) -->
  <line x1="280" y1="140" x2="320" y2="160" stroke="#2c3958" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="220" y="138" font-size="10" font-style="italic" fill="#5a6b8a">кріплення</text>

  <!-- Бортова мережа → зарядка -->
  <line x1="160" y1="344" x2="160" y2="252" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="170" y="300" font-size="10" font-style="italic" fill="#5a6b8a">+12V</text>

  <!-- Driver → touchscreen -->
  <line x1="160" y1="618" x2="318" y2="220" stroke="#2c3958" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="180" y="540" font-size="10" font-style="italic" fill="#5a6b8a">tap / swipe</text>

  <!-- External connections to phone -->
  <line x1="920" y1="150" x2="860" y2="218" stroke="#2c3958" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="855" y="180" font-size="10" font-style="italic" fill="#5a6b8a">GPS</text>

  <line x1="920" y1="250" x2="860" y2="400" stroke="#2c3958" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="870" y="320" font-size="10" font-style="italic" fill="#5a6b8a">4G/LTE</text>

  <line x1="920" y1="350" x2="860" y2="402" stroke="#2c3958" stroke-width="1.4" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <line x1="920" y1="450" x2="860" y2="403" stroke="#2c3958" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <line x1="920" y1="550" x2="860" y2="405" stroke="#2c3958" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- ============== Bottom legend ============== -->
  <rect x="20" y="788" width="1240" height="26" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="30" y="806" font-size="10" font-style="italic" fill="#5a4a2a">АРМ водія — це переносна одиниця обладнання: смартфон з застосунком RoutePulse, утримувач у кабіні ТЗ та джерело живлення; узгоджено з рис. 3.5 (КТЗ) та рис. 3.7 (мережа).</text>
</svg>
