<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="filled-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2c3958"/>
    </marker>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#2c3958" stroke-width="1.4"/>
    </marker>
  </defs>

  <text x="640" y="24" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 2.9. Діаграма послідовності для сценарію «Передача GPS-телеметрії з offline-чергою (WorkManager)»</text>

  <!-- ========== Participants header ========== -->
  <g transform="translate(80,52)">
    <circle cx="0" cy="0" r="10" fill="#f4e7c8" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="10" x2="0" y2="40" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="-16" y1="22" x2="16" y2="22" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="40" x2="-14" y2="62" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="40" x2="14" y2="62" stroke="#7a6a4a" stroke-width="1.4"/>
    <text x="0" y="82" text-anchor="middle" font-size="13" fill="#2c3958">:Водій</text>
  </g>

  <rect x="160" y="92" width="120" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="220" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:ActiveTripScreen</text>

  <rect x="305" y="92" width="130" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="370" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:LocationService</text>

  <rect x="455" y="92" width="130" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="520" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:LocalQueue (Room)</text>

  <rect x="605" y="92" width="130" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="670" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:TelemetrySyncWorker</text>

  <rect x="755" y="92" width="130" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="820" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:ApiService</text>

  <rect x="905" y="92" width="140" height="32" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="975" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:TelemetryController</text>

  <rect x="1065" y="92" width="150" height="32" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="1140" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:MongoDB (telemetry)</text>

  <line x1="890" y1="40" x2="890" y2="790" stroke="#bcc6da" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="903" y="42" font-size="10" fill="#7a8aac" font-style="italic">Server side</text>

  <!-- Lifelines -->
  <line x1="80" y1="124" x2="80" y2="790" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="220" y1="124" x2="220" y2="790" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="370" y1="124" x2="370" y2="790" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="520" y1="124" x2="520" y2="790" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="670" y1="124" x2="670" y2="790" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="820" y1="124" x2="820" y2="790" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="975" y1="124" x2="975" y2="790" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1140" y1="124" x2="1140" y2="790" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Phase A header -->
  <rect x="150" y="142" width="1090" height="22" fill="#eaf3eb" stroke="#7a9a7a" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="160" y="158" font-size="11" font-style="italic" fill="#3a6a3a">Фаза А — Запуск трекінгу та локальна черга</text>

  <!-- Activation bars Phase A -->
  <rect x="216" y="180" width="8" height="60" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="366" y="210" width="8" height="115" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="516" y="298" width="8" height="22" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>

  <line x1="82" y1="180" x2="216" y2="180" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="149" y="174" text-anchor="middle" font-size="11" fill="#2c3958">1: активний рейс</text>

  <line x1="224" y1="210" x2="366" y2="210" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="295" y="204" text-anchor="middle" font-size="11" fill="#2c3958">2: startForegroundService(waybillId)</text>

  <path d="M374,240 C420,235 420,255 374,255" fill="none" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="430" y="250" font-size="11" fill="#2c3958">3: FusedLocationProvider.requestLocationUpdates(5s)</text>

  <!-- LOOP frame around #4 -->
  <rect x="350" y="275" width="200" height="50" fill="none" stroke="#7a8aac" stroke-width="1.2"/>
  <rect x="350" y="275" width="58" height="18" fill="#dfeaf7" stroke="#7a8aac" stroke-width="1.2"/>
  <text x="358" y="288" font-size="11" font-weight="bold" fill="#2c3958">loop</text>
  <text x="413" y="288" font-size="10" font-style="italic" fill="#4a5b7a">[кожні 5 с]</text>

  <line x1="374" y1="310" x2="516" y2="310" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="445" y="304" text-anchor="middle" font-size="11" fill="#2c3958">4: insertLocation(lat,lng,v,ts)</text>

  <!-- Time gap visual -->
  <line x1="80" y1="345" x2="1140" y2="345" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2,4"/>
  <text x="640" y="340" text-anchor="middle" font-size="10" font-style="italic" fill="#7a8aac">. . . . . . . . . . . . . . . . . час очікування (15 хв) . . . . . . . . . . . . . . . .</text>

  <!-- Phase B header -->
  <rect x="150" y="358" width="1090" height="22" fill="#eaf3eb" stroke="#7a9a7a" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="160" y="374" font-size="11" font-style="italic" fill="#3a6a3a">Фаза Б — Періодична синхронізація батчів (PeriodicWorkRequest, NetworkType.CONNECTED, 15 хв)</text>

  <!-- Phase B Activation bars -->
  <rect x="666" y="400" width="8" height="335" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="516" y="430" width="8" height="55" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="816" y="500" width="8" height="125" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="971" y="530" width="8" height="65" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="1136" y="560" width="8" height="32" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>

  <!-- Message 5: WorkManager triggers Worker -->
  <path d="M620,395 L666,395" fill="none" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <rect x="465" y="385" width="155" height="22" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="542" y="400" text-anchor="middle" font-size="10" font-style="italic" fill="#5a4a2a">WorkManager → doWork()</text>

  <line x1="666" y1="430" x2="524" y2="430" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="595" y="424" text-anchor="middle" font-size="11" fill="#2c3958">6: getPendingBatch(max=100)</text>

  <line x1="516" y1="460" x2="674" y2="460" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="595" y="454" text-anchor="middle" font-size="11" fill="#4a5b7a">7: List&lt;LocationRow&gt;</text>

  <line x1="674" y1="500" x2="816" y2="500" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="745" y="494" text-anchor="middle" font-size="11" fill="#2c3958">8: POST /api/telemetry {batch}</text>

  <line x1="824" y1="530" x2="971" y2="530" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="897" y="524" text-anchor="middle" font-size="11" fill="#2c3958">9: HTTPS POST {JWT, locations[]}</text>

  <line x1="979" y1="560" x2="1136" y2="560" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="1057" y="554" text-anchor="middle" font-size="11" fill="#2c3958">10: Telemetry.create({locations, bucket_start})</text>

  <line x1="1136" y1="592" x2="979" y2="592" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="1057" y="586" text-anchor="middle" font-size="11" fill="#4a5b7a">11: {_id, count}</text>

  <line x1="971" y1="622" x2="824" y2="622" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="897" y="616" text-anchor="middle" font-size="11" fill="#4a5b7a">12: 201 Created</text>

  <line x1="816" y1="652" x2="674" y2="652" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="745" y="646" text-anchor="middle" font-size="11" fill="#4a5b7a">13: response (TelemetryDto)</text>

  <line x1="666" y1="682" x2="524" y2="682" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="595" y="676" text-anchor="middle" font-size="11" fill="#2c3958">14: deleteSynced(rowIds)</text>

  <rect x="520" y="700" width="280" height="22" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="660" y="715" text-anchor="middle" font-size="10" font-style="italic" fill="#5a4a2a">Worker → Result.success()  /  alt: Result.retry() при no-network</text>

  <rect x="180" y="740" width="900" height="40" fill="#fdf3f3" stroke="#c97070" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="630" y="756" text-anchor="middle" font-size="10" font-style="italic" fill="#7a3a3a">alt [немає мережі або 5xx від сервера]: Worker повертає Result.retry() — WorkManager перепланує запуск з exponential</text>
  <text x="630" y="771" text-anchor="middle" font-size="10" font-style="italic" fill="#7a3a3a">backoff (мін. 30 с). Локальна черга не очищається, дані не втрачаються; повторна спроба при появі мережі.</text>
</svg>
