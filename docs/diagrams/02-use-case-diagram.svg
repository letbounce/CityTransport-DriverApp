<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="870" viewBox="0 0 1000 870"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="open-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,1 L10,6 L0,11" fill="none" stroke="#4a5b7a" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- Title (можна вирізати, якщо підпис буде у Word) -->
  <text x="500" y="28" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">
    Рис. 2.2. Діаграма прецедентів інформаційної підсистеми «Мобільний термінал водія»
  </text>

  <!-- System boundary -->
  <rect x="180" y="55" width="640" height="780" fill="#ffffff" stroke="#7a8aac" stroke-width="1.5" rx="2"/>
  <text x="500" y="83" text-anchor="middle" font-size="17" fill="#3d4a66">Мобільний термінал водія</text>

  <!-- Use case 1: Авторизуватися -->
  <ellipse cx="500" cy="160" rx="130" ry="40" fill="#dfeaf7" stroke="#6a85b0" stroke-width="1.4"/>
  <text x="500" y="156" text-anchor="middle" font-size="15" fill="#2c3958">Авторизуватися</text>
  <text x="500" y="176" text-anchor="middle" font-size="15" fill="#2c3958">в системі</text>

  <!-- Use case 2: Отримати дорожній лист -->
  <ellipse cx="500" cy="270" rx="130" ry="40" fill="#dfeaf7" stroke="#6a85b0" stroke-width="1.4"/>
  <text x="500" y="266" text-anchor="middle" font-size="15" fill="#2c3958">Отримати</text>
  <text x="500" y="286" text-anchor="middle" font-size="15" fill="#2c3958">дорожній лист</text>

  <!-- Use case 3: Виконувати активний рейс -->
  <ellipse cx="500" cy="395" rx="130" ry="40" fill="#dfeaf7" stroke="#6a85b0" stroke-width="1.4"/>
  <text x="500" y="391" text-anchor="middle" font-size="15" fill="#2c3958">Виконувати</text>
  <text x="500" y="411" text-anchor="middle" font-size="15" fill="#2c3958">активний рейс</text>

  <!-- Use case 4: Передавати GPS-телеметрію (include) -->
  <ellipse cx="500" cy="525" rx="130" ry="40" fill="#dfeaf7" stroke="#6a85b0" stroke-width="1.4"/>
  <text x="500" y="521" text-anchor="middle" font-size="15" fill="#2c3958">Передавати GPS-</text>
  <text x="500" y="541" text-anchor="middle" font-size="15" fill="#2c3958">телеметрію</text>

  <!-- include arrow from #3 to #4 -->
  <line x1="500" y1="435" x2="500" y2="481" stroke="#4a5b7a" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="510" y="465" font-size="13" font-style="italic" fill="#4a5b7a">«include»</text>

  <!-- Use case 5: Зареєструвати інцидент -->
  <ellipse cx="500" cy="650" rx="130" ry="40" fill="#dfeaf7" stroke="#6a85b0" stroke-width="1.4"/>
  <text x="500" y="646" text-anchor="middle" font-size="15" fill="#2c3958">Зареєструвати</text>
  <text x="500" y="666" text-anchor="middle" font-size="15" fill="#2c3958">інцидент</text>

  <!-- Use case 6: Завершити рейс -->
  <ellipse cx="500" cy="770" rx="130" ry="40" fill="#dfeaf7" stroke="#6a85b0" stroke-width="1.4"/>
  <text x="500" y="766" text-anchor="middle" font-size="15" fill="#2c3958">Завершити /</text>
  <text x="500" y="786" text-anchor="middle" font-size="15" fill="#2c3958">архівувати рейс</text>

  <!-- Actor Водій (left) -->
  <g transform="translate(80,395)">
    <circle cx="0" cy="0" r="14" fill="#f4e7c8" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="14" x2="0" y2="58" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="-24" y1="32" x2="24" y2="32" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="58" x2="-20" y2="92" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="58" x2="20" y2="92" stroke="#7a6a4a" stroke-width="1.4"/>
    <text x="0" y="118" text-anchor="middle" font-size="15" fill="#2c3958">Водій</text>
  </g>

  <!-- Actor Серверна підсистема (right) -->
  <g transform="translate(920,395)">
    <circle cx="0" cy="0" r="14" fill="#f4e7c8" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="14" x2="0" y2="58" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="-24" y1="32" x2="24" y2="32" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="58" x2="-20" y2="92" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="58" x2="20" y2="92" stroke="#7a6a4a" stroke-width="1.4"/>
    <text x="0" y="118" text-anchor="middle" font-size="15" fill="#2c3958">Серверна</text>
    <text x="0" y="136" text-anchor="middle" font-size="15" fill="#2c3958">підсистема</text>
  </g>

  <!-- Связи Водій → use cases -->
  <line x1="100" y1="390" x2="370" y2="160" stroke="#5a6b8a" stroke-width="1.2"/>
  <line x1="100" y1="392" x2="370" y2="270" stroke="#5a6b8a" stroke-width="1.2"/>
  <line x1="100" y1="395" x2="370" y2="395" stroke="#5a6b8a" stroke-width="1.2"/>
  <line x1="100" y1="398" x2="370" y2="650" stroke="#5a6b8a" stroke-width="1.2"/>
  <line x1="100" y1="400" x2="370" y2="770" stroke="#5a6b8a" stroke-width="1.2"/>

  <!-- Связи Серверна підсистема → use cases (без #3 - локальний UX) -->
  <line x1="900" y1="390" x2="630" y2="160" stroke="#5a6b8a" stroke-width="1.2"/>
  <line x1="900" y1="392" x2="630" y2="270" stroke="#5a6b8a" stroke-width="1.2"/>
  <line x1="900" y1="395" x2="630" y2="525" stroke="#5a6b8a" stroke-width="1.2"/>
  <line x1="900" y1="398" x2="630" y2="650" stroke="#5a6b8a" stroke-width="1.2"/>
  <line x1="900" y1="400" x2="630" y2="770" stroke="#5a6b8a" stroke-width="1.2"/>
</svg>
