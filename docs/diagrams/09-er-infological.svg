<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <!-- Crow's foot (N / many) -->
    <marker id="crow" viewBox="0 0 16 14" refX="14" refY="7" markerWidth="16" markerHeight="14" orient="auto">
      <path d="M14,7 L0,0 M14,7 L0,7 M14,7 L0,14" fill="none" stroke="#2c3958" stroke-width="1.2"/>
    </marker>
    <!-- One (1) -->
    <marker id="one" viewBox="0 0 10 14" refX="6" refY="7" markerWidth="10" markerHeight="14" orient="auto">
      <line x1="6" y1="1" x2="6" y2="13" stroke="#2c3958" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="640" y="24" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 3.1. Інфологічна модель бази даних інформаційної підсистеми «Мобільний термінал водія» (нотація Crow's foot)</text>

  <!-- ====== Entities ====== -->

  <!-- DRIVER (top-left) -->
  <g transform="translate(60,80)">
    <rect x="0" y="0" width="220" height="160" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <rect x="1" y="1" width="218" height="26" fill="#dfeaf7" stroke="none"/>
    <line x1="0" y1="26" x2="220" y2="26" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="110" y="19" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">DRIVER (Водій)</text>
    <text x="12" y="46" font-size="11" font-weight="bold" fill="#2c3958">PK  driver_id</text>
    <text x="12" y="64" font-size="11" fill="#2c3958">      full_name</text>
    <text x="12" y="82" font-size="11" fill="#2c3958">      phone</text>
    <text x="12" y="100" font-size="11" fill="#2c3958">      password_hash</text>
    <text x="12" y="118" font-size="11" fill="#2c3958">      role</text>
    <text x="12" y="136" font-size="11" fill="#2c3958">      is_active</text>
    <text x="12" y="154" font-size="11" fill="#2c3958">      created_at</text>
  </g>

  <!-- ROUTE (top-center-left) -->
  <g transform="translate(340,80)">
    <rect x="0" y="0" width="220" height="160" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <rect x="1" y="1" width="218" height="26" fill="#dfeaf7" stroke="none"/>
    <line x1="0" y1="26" x2="220" y2="26" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="110" y="19" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">ROUTE (Маршрут)</text>
    <text x="12" y="46" font-size="11" font-weight="bold" fill="#2c3958">PK  route_id</text>
    <text x="12" y="64" font-size="11" fill="#2c3958">      route_number</text>
    <text x="12" y="82" font-size="11" fill="#2c3958">      route_name</text>
    <text x="12" y="100" font-size="11" fill="#2c3958">      vehicle_type</text>
    <text x="12" y="118" font-size="11" fill="#2c3958">      is_active</text>
  </g>

  <!-- STOP (top-center-right) -->
  <g transform="translate(620,80)">
    <rect x="0" y="0" width="220" height="160" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <rect x="1" y="1" width="218" height="26" fill="#dfeaf7" stroke="none"/>
    <line x1="0" y1="26" x2="220" y2="26" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="110" y="19" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">STOP (Зупинка)</text>
    <text x="12" y="46" font-size="11" font-weight="bold" fill="#2c3958">PK  stop_id</text>
    <text x="12" y="64" font-size="11" font-style="italic" fill="#2c3958">FK   route_id</text>
    <text x="12" y="82" font-size="11" fill="#2c3958">      stop_number</text>
    <text x="12" y="100" font-size="11" fill="#2c3958">      name</text>
    <text x="12" y="118" font-size="11" fill="#2c3958">      planned_time</text>
    <text x="12" y="136" font-size="11" fill="#2c3958">      lat, lng</text>
  </g>

  <!-- VEHICLE (top-right) -->
  <g transform="translate(900,80)">
    <rect x="0" y="0" width="220" height="160" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <rect x="1" y="1" width="218" height="26" fill="#dfeaf7" stroke="none"/>
    <line x1="0" y1="26" x2="220" y2="26" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="110" y="19" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">VEHICLE (Транспорт)</text>
    <text x="12" y="46" font-size="11" font-weight="bold" fill="#2c3958">PK  vehicle_id</text>
    <text x="12" y="64" font-size="11" fill="#2c3958">      label</text>
    <text x="12" y="82" font-size="11" fill="#2c3958">      plate_number</text>
    <text x="12" y="100" font-size="11" fill="#2c3958">      is_active</text>
  </g>

  <!-- WAYBILL (center) -->
  <g transform="translate(480,360)">
    <rect x="0" y="0" width="240" height="220" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.6"/>
    <rect x="1" y="1" width="238" height="26" fill="#dfeaf7" stroke="none"/>
    <line x1="0" y1="26" x2="240" y2="26" stroke="#5a6b8a" stroke-width="1.6"/>
    <text x="120" y="19" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">WAYBILL (Дорожній лист)</text>
    <text x="12" y="46" font-size="11" font-weight="bold" fill="#2c3958">PK  waybill_id</text>
    <text x="12" y="64" font-size="11" font-style="italic" fill="#2c3958">FK   driver_id</text>
    <text x="12" y="82" font-size="11" font-style="italic" fill="#2c3958">FK   route_id</text>
    <text x="12" y="100" font-size="11" font-style="italic" fill="#2c3958">FK   vehicle_id</text>
    <text x="12" y="118" font-size="11" fill="#2c3958">      status</text>
    <text x="12" y="136" font-size="11" fill="#2c3958">      started_at</text>
    <text x="12" y="154" font-size="11" fill="#2c3958">      completed_at</text>
    <text x="12" y="172" font-size="11" fill="#2c3958">      deleted_at</text>
    <text x="12" y="190" font-size="11" fill="#2c3958">      deletion_reason_code</text>
    <text x="12" y="208" font-size="11" fill="#2c3958">      notes</text>
  </g>

  <!-- INCIDENT (bottom-left) -->
  <g transform="translate(120,650)">
    <rect x="0" y="0" width="240" height="180" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <rect x="1" y="1" width="238" height="26" fill="#dfeaf7" stroke="none"/>
    <line x1="0" y1="26" x2="240" y2="26" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="120" y="19" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">INCIDENT (Інцидент)</text>
    <text x="12" y="46" font-size="11" font-weight="bold" fill="#2c3958">PK  incident_id</text>
    <text x="12" y="64" font-size="11" font-style="italic" fill="#2c3958">FK   waybill_id</text>
    <text x="12" y="82" font-size="11" font-style="italic" fill="#2c3958">FK   driver_id</text>
    <text x="12" y="100" font-size="11" fill="#2c3958">      type</text>
    <text x="12" y="118" font-size="11" fill="#2c3958">      description</text>
    <text x="12" y="136" font-size="11" fill="#2c3958">      location (lat, lng)</text>
    <text x="12" y="154" font-size="11" fill="#2c3958">      photo_url, reported_at</text>
    <text x="12" y="172" font-size="11" fill="#2c3958">      status, version_history</text>
  </g>

  <!-- TELEMETRY (bottom-right) -->
  <g transform="translate(840,650)">
    <rect x="0" y="0" width="240" height="180" fill="#eef3f9" stroke="#5a6b8a" stroke-width="1.4"/>
    <rect x="1" y="1" width="238" height="26" fill="#dfeaf7" stroke="none"/>
    <line x1="0" y1="26" x2="240" y2="26" stroke="#5a6b8a" stroke-width="1.4"/>
    <text x="120" y="19" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3958">TELEMETRY (Телеметрія)</text>
    <text x="12" y="46" font-size="11" font-weight="bold" fill="#2c3958">PK  telemetry_id</text>
    <text x="12" y="64" font-size="11" font-style="italic" fill="#2c3958">FK   waybill_id</text>
    <text x="12" y="82" font-size="11" font-style="italic" fill="#2c3958">FK   driver_id</text>
    <text x="12" y="100" font-size="11" fill="#2c3958">      bucket_start</text>
    <text x="12" y="118" font-size="11" fill="#2c3958">      locations[ ]</text>
    <text x="12" y="136" font-size="11" fill="#2c3958">          (lat, lng,</text>
    <text x="12" y="154" font-size="11" fill="#2c3958">           speed_kmh, timestamp)</text>
    <text x="12" y="172" font-size="11" fill="#2c3958">      count</text>
  </g>

  <!-- ====== Relationships ====== -->

  <!-- DRIVER (1) — (N) WAYBILL -->
  <line x1="280" y1="195" x2="478" y2="380" stroke="#2c3958" stroke-width="1.4"
        marker-start="url(#one)" marker-end="url(#crow)"/>
  <text x="320" y="280" font-size="11" font-style="italic" fill="#4a5b7a">"виконує"</text>

  <!-- ROUTE (1) — (N) WAYBILL -->
  <line x1="450" y1="240" x2="540" y2="360" stroke="#2c3958" stroke-width="1.4"
        marker-start="url(#one)" marker-end="url(#crow)"/>
  <text x="468" y="305" font-size="11" font-style="italic" fill="#4a5b7a">"обслуговує"</text>

  <!-- ROUTE (1) — (N) STOP -->
  <line x1="560" y1="160" x2="620" y2="160" stroke="#2c3958" stroke-width="1.4"
        marker-start="url(#one)" marker-end="url(#crow)"/>
  <text x="568" y="153" font-size="11" font-style="italic" fill="#4a5b7a">"містить"</text>

  <!-- VEHICLE (1) — (N) WAYBILL -->
  <line x1="900" y1="195" x2="720" y2="380" stroke="#2c3958" stroke-width="1.4"
        marker-start="url(#one)" marker-end="url(#crow)"/>
  <text x="820" y="280" font-size="11" font-style="italic" fill="#4a5b7a">"експлуатується"</text>

  <!-- WAYBILL (1) — (N) INCIDENT -->
  <line x1="500" y1="580" x2="280" y2="650" stroke="#2c3958" stroke-width="1.4"
        marker-start="url(#one)" marker-end="url(#crow)"/>
  <text x="335" y="630" font-size="11" font-style="italic" fill="#4a5b7a">"має"</text>

  <!-- WAYBILL (1) — (N) TELEMETRY -->
  <line x1="700" y1="580" x2="920" y2="650" stroke="#2c3958" stroke-width="1.4"
        marker-start="url(#one)" marker-end="url(#crow)"/>
  <text x="800" y="630" font-size="11" font-style="italic" fill="#4a5b7a">"генерує треки"</text>

  <!-- Legend -->
  <rect x="60" y="280" width="220" height="62" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="70" y="297" font-size="11" font-style="italic" fill="#5a4a2a">Позначення Crow's foot:</text>
  <line x1="80" y1="313" x2="130" y2="313" stroke="#2c3958" stroke-width="1.4" marker-start="url(#one)" marker-end="url(#crow)"/>
  <text x="138" y="317" font-size="10" fill="#5a4a2a">— "один-до-багатьох" (1..N)</text>
  <text x="70" y="333" font-size="10" fill="#5a4a2a">PK — первинний ключ;  FK — зовнішній (курсив)</text>
</svg>
