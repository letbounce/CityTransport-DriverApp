<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="filled-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2c3958"/>
    </marker>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#2c3958" stroke-width="1.4"/>
    </marker>
  </defs>

  <text x="600" y="24" text-anchor="middle" font-size="14" font-style="italic" fill="#5a6b8a">Рис. 2.6. Діаграма послідовності для сценарію «Авторизація водія (Login → JWT)»</text>

  <!-- ========== Participants header ========== -->
  <g transform="translate(80,52)">
    <circle cx="0" cy="0" r="10" fill="#f4e7c8" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="10" x2="0" y2="40" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="-16" y1="22" x2="16" y2="22" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="40" x2="-14" y2="62" stroke="#7a6a4a" stroke-width="1.4"/>
    <line x1="0" y1="40" x2="14" y2="62" stroke="#7a6a4a" stroke-width="1.4"/>
    <text x="0" y="82" text-anchor="middle" font-size="13" fill="#2c3958">:Водій</text>
  </g>

  <rect x="172" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="240" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:LoginScreen</text>

  <rect x="332" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="400" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:LoginViewModel</text>

  <rect x="492" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="560" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:AuthRepository</text>

  <rect x="652" y="92" width="136" height="32" fill="#fdf6e3" stroke="#b89a5c" stroke-width="1.4"/>
  <text x="720" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:ApiService (Retrofit)</text>

  <rect x="822" y="92" width="136" height="32" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="890" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:AuthController</text>

  <rect x="992" y="92" width="136" height="32" fill="#dfeaf7" stroke="#5a6b8a" stroke-width="1.4"/>
  <text x="1060" y="112" text-anchor="middle" font-size="12" fill="#2c3958">:MongoDB (drivers)</text>

  <line x1="800" y1="40" x2="800" y2="690" stroke="#bcc6da" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="813" y="42" font-size="10" fill="#7a8aac" font-style="italic">Server side</text>

  <!-- Lifelines -->
  <line x1="80" y1="124" x2="80" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="240" y1="124" x2="240" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="400" y1="124" x2="400" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="560" y1="124" x2="560" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="720" y1="124" x2="720" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="890" y1="124" x2="890" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1060" y1="124" x2="1060" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Activation bars -->
  <rect x="236" y="160" width="8" height="465" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="396" y="190" width="8" height="405" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="556" y="220" width="8" height="345" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="716" y="250" width="8" height="285" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="886" y="280" width="8" height="225" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>
  <rect x="1056" y="310" width="8" height="40" fill="#eaf0fa" stroke="#5a6b8a" stroke-width="0.8"/>

  <!-- Messages -->
  <line x1="82" y1="160" x2="236" y2="160" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="159" y="154" text-anchor="middle" font-size="11" fill="#2c3958">1: tap "УВІЙТИ" (driverId, password)</text>

  <line x1="244" y1="190" x2="396" y2="190" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="320" y="184" text-anchor="middle" font-size="11" fill="#2c3958">2: onLogin()</text>

  <line x1="404" y1="220" x2="556" y2="220" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="480" y="214" text-anchor="middle" font-size="11" fill="#2c3958">3: login(driverId, password)</text>

  <line x1="564" y1="250" x2="716" y2="250" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="640" y="244" text-anchor="middle" font-size="11" fill="#2c3958">4: POST /api/auth/login</text>

  <line x1="724" y1="280" x2="886" y2="280" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="805" y="274" text-anchor="middle" font-size="11" fill="#2c3958">5: HTTPS POST {driver_id, password}</text>

  <line x1="894" y1="310" x2="1056" y2="310" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="975" y="304" text-anchor="middle" font-size="11" fill="#2c3958">6: findOne({driver_id, is_active})</text>

  <line x1="1056" y1="345" x2="894" y2="345" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="975" y="339" text-anchor="middle" font-size="11" fill="#4a5b7a">7: Driver{password_hash, role}</text>

  <!-- Note: bcrypt + jwt -->
  <rect x="820" y="365" width="220" height="40" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="930" y="381" text-anchor="middle" font-size="10" font-style="italic" fill="#5a4a2a">bcrypt.compare(password, hash)</text>
  <text x="930" y="396" text-anchor="middle" font-size="10" font-style="italic" fill="#5a4a2a">jwt.sign(payload, secret, 8h)</text>

  <line x1="886" y1="425" x2="724" y2="425" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="805" y="419" text-anchor="middle" font-size="11" fill="#4a5b7a">8: 200 {token, driver}</text>

  <line x1="716" y1="455" x2="564" y2="455" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="640" y="449" text-anchor="middle" font-size="11" fill="#4a5b7a">9: AuthSession</text>

  <!-- Note: SessionStore save -->
  <rect x="450" y="470" width="220" height="40" fill="#fffce8" stroke="#b89a5c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="560" y="486" text-anchor="middle" font-size="10" font-style="italic" fill="#5a4a2a">sessionStore.save(token)</text>
  <text x="560" y="501" text-anchor="middle" font-size="10" font-style="italic" fill="#5a4a2a">tokenProvider.setToken() · DataStore</text>

  <line x1="556" y1="535" x2="404" y2="535" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="480" y="529" text-anchor="middle" font-size="11" fill="#4a5b7a">10: Result.Success(AuthSession)</text>

  <line x1="396" y1="565" x2="244" y2="565" stroke="#2c3958" stroke-width="1.3" marker-end="url(#filled-arrow)"/>
  <text x="320" y="559" text-anchor="middle" font-size="11" fill="#2c3958">11: emit(uiState.copy(isSuccess=true))</text>

  <line x1="236" y1="600" x2="92" y2="600" stroke="#2c3958" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open-arrow)"/>
  <text x="160" y="594" text-anchor="middle" font-size="11" fill="#4a5b7a">12: navigateTo(HomeMenu)</text>

  <!-- alt: invalid creds note (bottom hint) -->
  <rect x="180" y="635" width="800" height="40" fill="#fdf3f3" stroke="#c97070" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="580" y="651" text-anchor="middle" font-size="10" font-style="italic" fill="#7a3a3a">alt [невірні credentials або !is_active]: AuthController повертає 401 Unauthorized;</text>
  <text x="580" y="666" text-anchor="middle" font-size="10" font-style="italic" fill="#7a3a3a">Repository → Result.failure → ViewModel показує error "Помилка авторизації", навігація не відбувається.</text>
</svg>
